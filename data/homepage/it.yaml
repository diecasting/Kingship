intro:
  heading: "Chi siamo"
  lead: "Un produttore B2B integrato verticalmente che garantisce affidabilità dal metallo fuso al componente finito."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. è un fornitore B2B dedicato di
    pressofusione ad alta pressione in leghe di alluminio e magnesio, lavorazione CNC interna
    post-processo, rheocasting semi-solido e ingegneria professionale di attrezzature. Da oltre
    due decenni aiutiamo clienti dei settori automotive, veicoli elettrici, aerospaziale,
    medicale e industriale a trasformare geometrie impegnative in parti di produzione ripetibili
    e ad alta integrità.

    Non siamo una trading company. Ogni fusione viene prodotta all'interno del nostro stabilimento
    di Dongguan, dove celle di pressofusione a camera fredda moderna sono integrate con estrazione
    robotizzata completamente automatizzata, rilevamento porosità a raggi X in tempo reale e un
    centro di lavorazione CNC ad alta precisione. Questa integrazione verticale ci consente di
    controllare precisione dimensionale, qualità superficiale e tempi di consegna su tutto il
    processo — progettazione, simulazione, fusione, lavorazione, finitura e ispezione — sotto un
    unico sistema di gestione qualità certificato ISO 9001 e IATF 16949.

    Il nostro team di ingegneria collabora con i clienti fin dalla prima revisione DFM, utilizzando
    simulazioni Magma e Moldflow per eliminare ritiri a freddo, intrappolamento d'aria e porosità
    da ritiro prima di realizzare il primo stampo. Il risultato è un ciclo di sviluppo più breve,
    un costo per pezzo inferiore e componenti strutturali che superano la qualificazione al primo
    tentativo. Che tu abbia bisogno di un supporto in magnesio leggero, di una parte rheocast
    semisolida trattabile termicamente, o di una grande struttura da 5000T per una piattaforma
    batteria EV, KingShip è costruita per essere il tuo partner manifatturiero a lungo termine.

