intro:
  heading: "Qui nous sommes"
  lead: "Un fabricant B2B de moulage par injection verticalement intégré, du métal liquide à la pièce finie."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. est un fournisseur B2B spécialisé dans le moulage
    sous pression haute pression d'alliages d'aluminium et de magnésium, l'usinage CNC interne, le
    rheocasting semi-solide et la conception d'outillages professionnels. Depuis plus de deux décennies,
    nous aidons les clients de l'automobile, du véhicule électrique, de l'aéronautique, du médical et de
    l'industrie à transformer des géométries exigeantes en pièces de production répétables et de haute intégrité.

    Nous ne sommes pas un courtier. Chaque pièce est produite dans notre propre usine de Dongguan, où des
    cellules de moulage sous pression en chambre froide modernes sont intégrées à une extraction robotisée
    entièrement automatisée, à la détection de porosité par rayons X en temps réel et à un centre d'usinage
    CNC de haute précision. Cette intégration verticale nous permet de contrôler la précision dimensionnelle,
    la qualité de surface et le délai sur l'ensemble du processus — conception, simulation, moulage, usinage,
    finition et inspection — sous un unique système de management de la qualité certifié ISO 9001 et IATF 16949.

    Notre équipe d'ingénierie collabore avec les clients dès le premier examen DFM, en utilisant la simulation
    Magma et Moldflow pour éliminer les coulées à froid, le piégeage d'air et la porosité par retrait avant
    la fabrication du premier outillage. Le résultat est un cycle de développement plus court, un coût par
    pièce réduit et des composants structurels qualifiés du premier coup.

