      alt: "Präzise Multi-Achs-CNC-Bearbeitung toleranzgenauer Gussteile"
      title: "Präzise CNC-Bearbeitung"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Druckguss-Werkzeuge"
    heading: "Druckguss-Werkzeuge"
    body: |
      Die Werkzeugqualität bestimmt alles, was folgt. KingShip betreibt eine interne Werkzeugbauabteilung
      mit moderner CAD/CAM, Pro/E, UG und Moldflow-Simulation, um Werkzeuge zu entwerfen und zu bauen,
      die länger laufen und sauberere Teile erzeugen. Optimierte Anguss- und Kühlsysteme reduzieren
      Zykluszeit, minimieren Porosität und verlängern die Werkzeugstandzeit über 100.000 Schuss.

      Werkzeugbau unter eigenem Dach bedeutet schnellere Iteration: Konstruktionsänderungen, Wartung und
      Aufarbeitung erfolgen ohne Fremdlieferzeiten. So schützen wir unser Know-how und halten es
      konsistent über eine Produktfamilie. Für Kleinserien bieten wir Bridge-Tooling, das Prototypen
      schnell in Ihre Hände spielt, bevor ein volles Produktionswerkzeug gebaut wird.
    materials:
      - "H13-Werkzeugstahl"
      - "Kundenspezifische Werkzeugmaterialien"
    processes:
      - "Werkzeugdesign & Simulation"
      - "Interner Werkzeugbau"
      - "Wartung & Aufarbeitung"
    equipment:
      - "CAD/CAM & Moldflow"
      - "CNC-Werkzeugraum"
    applications:
      - "Produktionswerkzeuge"
      - "Bridge-Tooling"
      - "Familienwerkzeuge"
