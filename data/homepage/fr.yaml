faq:
  heading: "Questions fréquentes"
  items:
    - question: "Quels alliages d'aluminium et magnésium coulez-vous ?"
      answer: "Les nuances d'aluminium et de magnésium sont étudiées selon le plan, l'application et la disponibilité actuelle des matières. L'alliage et l'état final sont confirmés pour chaque RFQ."
    - question: "Quelle est votre force de serrage maximale ?"
      answer: "Le choix de la machine est confirmé selon la taille de la pièce, le moule, l'alliage et le poids de coulée requis. Une étude de faisabilité propre au projet est réalisée avant le lancement."
    - question: "Proposez-vous usinage et inspection CNC internes ?"
      answer: "L'usinage CNC complémentaire est disponible en interne. Les spécifications de machine, les méthodes de contrôle et la faisabilité de chaque tolérance sont confirmées pour chaque projet."
    - question: "Êtes-vous certifiés selon les normes automobiles ?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd. détient le certificat IATF 16949:2016 T207408 / 0613009 pour la fabrication de pièces moulées et usinées, article 8.3 exclu, ainsi que le certificat ISO 9001:2015 DZ/CN/2411010Q pour les pièces mécaniques de précision et les moules de fonderie."
    - question: "Aidez-vous au DFM (conception pour la fabricabilité) ?"
      answer: "Le DFM peut inclure des simulations de remplissage, de solidification et de refroidissement lorsque cela correspond au périmètre. Les décisions de moule et de procédé restent soumises à une validation propre à la pièce."
    - question: "Quel est le délai de devis ?"
      answer: "Pour une RFQ bien définie, nous examinons le périmètre de fabrication, les exigences de contrôle et les risques du projet avant de confirmer le délai du devis."
    - question: "Proposez-vous l'outillage pont pour faible volume ?"
      answer: "Oui. Nous proposons l'outillage pont pour prototypes et validation de petits lots avant de s'engager dans un outillage de production complet."

rfq:
  heading: "Demander un devis"
  lead: "Envoyez vos plans et exigences pour la revue technique et la préparation de la RFQ."
  body: |
    Indiquez-nous votre matériau, épaisseur de paroi, tolérances, traitement de surface et volume annuel
    estimé. Notre équipe d'ingénierie examinera votre projet et répondra avec un plan de fabrication
    pratique et optimisé en coûts.
