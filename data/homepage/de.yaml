capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Aluminium-Druckguss"
    heading: "Aluminium-Druckguss"
    body: |
      Der Hochdruck-Aluminiumdruckguss ist das Rückgrat unserer Fertigung. Wir gießen eine breite
      Palette struktureller und funktionaler Bauteile in den Legierungen ADC12, A380, A356 und A360
      und balancieren Wärmeleitfähigkeit, Korrosionsbeständigkeit und Formstabilität für anspruchsvolle
      Einsatzumgebungen. Die Maschinenauswahl wird anhand von Bauteilgröße, Formenkonstruktion, Legierung
      und erforderlichem Schussgewicht geprüft.

      Die DFM-Prüfung kann Füll-, Erstarrungs- und Kühlungssimulationen umfassen, wenn dies zum
      Projektumfang passt. Die CNC-Nachbearbeitung unterstützt Funktionsflächen, Bohrungen und Dichtflächen;
      die Tolerierbarkeit wird für jedes Merkmal gesondert festgelegt. Verfügbarkeit von Sekundärprozessen
      wird im RFQ bestätigt.

      Typische Anwendungen sind Antriebsgehäuse, EV-Batterieträger und -halterungen, Kühlkörper,
      Leuchtengehäuse und Elektronikgehäuse. Legierung und Zustand werden anhand der Zeichnung und der
      aktuellen Materialverfügbarkeit bestätigt.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Hochdruck-Druckguss"
      - "CNC-Bearbeitung"
      - "Eloxieren & Pulverbeschichten"
      - "Impregnieren"
    equipment:
      - "Kaltkammer-HPDC-Prozessauswahl"
      - "CNC-Nachbearbeitung je Projekt"
    applications:
      - "Antriebsstrang"
      - "EV-Batteriegehäuse"
      - "Kühlkörper & Gehäuse"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "A356-Aluminiumdruckguss-Bauteil unter Porositätskontrolle"
      title: "A356-Aluminiumdruckguss"
    learn_more: "/de/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Magnesium-Druckguss"
    heading: "Magnesium-Druckguss"
    body: |
      Magnesium-Druckguss bietet die maximale Gewichtsreduzierung – etwa ein Drittel leichter als
      Aluminium bei vergleichbarer Steifigkeit – und ist daher das Material der Wahl für
      gewichtskritische Automobil-, Luftfahrt- und Premium-Elektronikbauteile. Magnesiumprojekte werden
      hinsichtlich Legierung, Maschinenkonfiguration, Dünnwandigkeit und Korrosionsstrategie geprüft,
      bevor der Produktionsumfang bestätigt wird.

      Die hohe Festigkeit bei geringem Gewicht und die exzellente EMI/RFI-Abschirmung von Magnesium
      sind wertvoll für EV-Halterungen, Sensorgehäuse, Drohnenrahmen und Handgeräte. Wir schützen die
      Oberflächenbehandlung und Prüfmethoden werden für die jeweilige Legierung, Anwendung und Zeichnung
      ausgewählt.

      Da Magnesiumguss strikte Prozesskontrolle erfordert, steuern unsere Ingenieure Schmelzschutz,
      Einspritzgeschwindigkeit und Werkzeugtemperatur eng, um Oxidation und Heißriss zu vermeiden.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Hochdruck-Magnesium-Druckguss"
      - "Passivierung"
      - "Galvanisieren"
    equipment:
      - "Prüfung der Magnesium-HPDC-Prozessroute"
      - "Projektbezogene Röntgenprüfplanung"
    applications:
      - "Automobilhalterungen"
      - "Luftfahrtbauteile"
      - "Premium-Handgeräte"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "Leichte Magnesium-Druckguss-Luftfahrt- und 3C-Elektronikteile"
      title: "Magnesium-Druckguss"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Semi-Solid-Rheocasting"
    heading: "Semi-Solid-Rheocasting"
    body: |
      Semi-Solid-Rheocasting ist ein Engineering-Ansatz für Projekte, die eine kontrollierte
      Slurry-Bildung, Wärmebehandelbarkeit und eine definierte Porositätsstrategie benötigen. Der
      Prozessplan hängt von Legierung, Geometrie, Formenkonstruktion und Abnahmeanforderungen ab.

      Wärmebehandlung, Schweißen, Bearbeitung und Prüfanforderungen werden für jede Anwendung geprüft.
      Aktuelle Produktionsfähigkeit, Ausrüstung und Legierungsqualifizierung werden bestätigt, bevor
      ein Rheocasting-Projekt angenommen wird.

      Rheocasting wird für EV- und Luftfahrt-Strukturprojekte bewertet, bei denen Prozessmechanismus,
      Materialverhalten und Prüfplanung gemeinsam betrachtet werden müssen.
    materials:
      - "Aluminium-Halbzeugqualität je RFQ"
      - "Projektbezogene Prozessprüfung"
    processes:
