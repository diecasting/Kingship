intro:
  heading: "会社概要"
  lead: "溶解から完成部品までを一貫生産する、垂直統合型のB2Bダイカストメーカー。"
  body: |
    KingShip（東莞）精密製造有限公司は、アルミニウム・マグネシウム合金の高圧ダイカスト、社内CNC後処理、
    半凝固レオキャスト、プロ用金型設計を専門とするB2Bサプライヤーです。20年以上にわたり、自動車、電気
    自動車（EV）、航空宇宙、医療、産業機器のお客様が抱える厳しい形状を、再現性の高い高品位な量産部品へ
    と変えるお手伝いをしてきました。

    私たちは商社ではありません。すべての鋳物は自社の東莞工場で生産され、最新のコールドチャンバー
    ダイカストセルに完全自動ロボット取出し、リアルタイムX線気孔検査、高精度CNC加工センターが統合されて
    います。この垂直統合により、設計・シミュレーション・鋳造・加工・仕上げ・検査の全工程を、ISO 9001および
    IATF 16949認証の一元的な品質マネジメントシステムのもとで管理できます。

    当社のエンジニアリングチームは最初のDFMレビューからお客様と協業し、Magma・Moldflowシミュレーションを
    用いて、金型製作前にコールドショット、巻き込み、収縮巣を排除します。その結果、開発期間の短縮、部品
    単価の低減、そして初回で合格する構造部品を実現します。

