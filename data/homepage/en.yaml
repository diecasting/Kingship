faq:
  heading: "Frequently Asked Questions"
  items:
    - question: "What aluminum and magnesium alloys do you cast?"
      answer: "We cast ADC12, A380, A356 and A360 aluminum alloys, plus AZ91D and AM60B magnesium alloys. Rheocasting slurries and custom compositions are available on request."
    - question: "What is your maximum die casting machine tonnage?"
      answer: "Our largest machine is a 5000-ton cold-chamber high-pressure die casting machine, capable of producing meter-scale thin-wall structural components for automotive and EV platforms."
    - question: "Do you provide in-house CNC machining and inspection?"
      answer: "Yes. We operate 3, 4 and 5-axis CNC machining centers and perform CMM dimensional verification, real-time X-ray porosity inspection and automated leak testing in-house."
    - question: "Are you certified to automotive quality standards?"
      answer: "KingShip is certified to ISO 9001 and IATF 16949, and our quality management system is built for automotive, aerospace and medical-grade requirements."
    - question: "Can you help with design for manufacturability (DFM)?"
      answer: "Absolutely. We run Magma and Moldflow simulation during the design phase to eliminate porosity and cold shuts before tooling, shortening development time and lowering piece cost."
    - question: "What is the typical quotation lead time?"
      answer: "For a well-defined RFQ with drawings and requirements, we typically return a comprehensive engineering review and formal quotation within 24 hours."
    - question: "Do you support low-volume bridge tooling?"
      answer: "Yes. We offer bridge tooling for efficient small-batch prototyping and validation before committing to a full production die."

