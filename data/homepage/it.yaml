capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Pressofusione di alluminio"
    heading: "Pressofusione di alluminio"
    body: |
      La pressofusione ad alta pressione di leghe di alluminio è la spina dorsale della nostra
      produzione. Coliamo un'ampia gamma di componenti strutturali e funzionali in leghe ADC12,
      A380, A356 e A360, bilanciando conduttività termica, resistenza alla corrosione e stabilità
      dimensionale per ambienti di servizio impegnativi. La scelta della macchina viene verificata in
      base alle dimensioni del componente, allo stampo, alla lega e al peso di colata richiesto.

      Il DFM può includere simulazioni di riempimento, solidificazione e raffreddamento quando
      pertinenti. La lavorazione CNC successiva supporta superfici funzionali, fori e superfici di
      tenuta; la fattibilità di ciascuna tolleranza viene definita per singola caratteristica. La
      disponibilità dei processi secondari viene confermata durante l'RFQ.

      Le applicazioni tipiche includono alloggiamenti per powertrain automotive, vasche e supporti
      per batterie EV, dissipatori di calore, alloggiamenti per illuminazione e involucri
      elettronici. La lega e lo stato finale vengono confermati in base al disegno, ai requisiti del
      progetto e alla disponibilità corrente dei materiali.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Pressofusione ad alta pressione"
      - "Lavorazione CNC"
      - "Anodizzazione e verniciatura a polvere"
      - "Impregnazione"
    equipment:
      - "Selezione del processo HPDC a camera fredda"
      - "Ambito di lavorazione CNC per progetto"
    applications:
      - "Powertrain automotive"
      - "Alloggiamenti batterie EV"
      - "Dissipatori e involucri"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "Componente in alluminio A356 sottoposto a controllo porosità in ispezione"
      title: "Pressofusione di alluminio A356"
    learn_more: "/it/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Pressofusione di magnesio"
    heading: "Pressofusione di magnesio"
    body: |
      La pressofusione di magnesio offre la massima riduzione di peso — circa un terzo più leggera
      dell'alluminio a rigidezza paragonabile — rendendola il materiale preferito per componenti
      automotive, aerospaziali ed elettronici di fascia alta critici per il peso. I progetti in
      magnesio vengono esaminati per lega, configurazione macchina, fattibilità delle pareti sottili
      e strategia anticorrosione prima della conferma dell'ambito produttivo.

      L'elevato rapporto resistenza/peso e l'ottima schermatura EMI/RFI del magnesio sono preziosi
      per supporti per veicoli elettrici, alloggiamenti per sensori, telai per droni e dispositivi
      portatili. Il trattamento superficiale e i metodi di ispezione vengono scelti in base alla lega,
      all'applicazione e ai requisiti del disegno.

      Poiché la colata del magnesio richiede un rigoroso controllo di processo, i nostri ingegneri
      gestiscono attentamente protezione del bagno, velocità di iniezione e temperatura dello stampo
      per evitare ossidazione e criccatura a caldo. Il risultato è un componente leggero e
      dimensionalmente stabile che aiuta gli OEM a raggiungere ambiziosi obiettivi di massa del
      veicolo e di autonomia senza sacrificare le prestazioni strutturali.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Pressofusione ad alta pressione di magnesio"
      - "Passivazione"
      - "Galvanica"
    equipment:
      - "Verifica del percorso HPDC magnesio"
      - "Pianificazione radiografica per progetto"
    applications:
      - "Supporti automotive"
      - "Componenti aerospaziali"
      - "Dispositivi portatili di fascia alta"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "Parti aerospaziali e componenti elettronici 3C leggeri in magnesio pressofuso"
      title: "Parti in magnesio pressofuso"
    learn_more: "/it/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Rheocasting semi-solido"
    heading: "Rheocasting semi-solido"
    body: |
      Il rheocasting semi-solido è un percorso ingegneristico per progetti che richiedono una
      formazione controllata della sospensione, trattabilità termica e una strategia definita per la
      porosità. Il piano di processo dipende da lega, geometria, stampo e criteri di accettazione.

      Requisiti di trattamento termico, saldatura, lavorazione e ispezione vengono esaminati per ogni
      applicazione. Capacità produttiva, attrezzature e qualificazione delle leghe vengono confermate
      prima di accettare un progetto di rheocasting.

      Il rheocasting viene valutato per progetti strutturali EV e aerospaziali in cui meccanismo di
      processo, comportamento del materiale e pianificazione ispettiva devono essere considerati insieme.
    materials:
      - "Grado di alluminio semisolido confermato all'RFQ"
      - "Revisione del processo per progetto"
    processes:
      - "Rheocasting semi-solido"
      - "Trattamento termico T5 / T6"
      - "Convalida metallografica"
    equipment:
      - "Percorso semisolido confermato all'RFQ"
      - "Pianificazione radiografica per progetto"
    applications:
      - "Nodi strutturali EV"
      - "Supporti aerospaziali"
      - "Componenti critici per la fatica"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "Componente strutturale in alluminio pressofuso"
      title: "Pressofusione strutturale in alluminio"
    learn_more: "/it/semi-solid-rheocasting/"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "Grandi fusioni strutturali"
    heading: "Grandi fusioni strutturali"
    body: |
      Le grandi fusioni strutturali possono riunire più componenti stampati o saldati in un unico
      componente leggero. Gli esempi comprendono binari laterali di vasche batteria, torri
      ammortizzatore, alloggiamenti tunnel e traverse.

      Queste parti richiedono un controllo preciso dell'iniezione, la gestione termica di uno stampo
      grande e finestre di processo disciplinate per controllare deformazione e porosità. La revisione
      ingegneristica considera dimensioni di macchina e stampo, peso di colata, lega e piano ispettivo
      prima di confermare la fattibilità.

      Il piano di processo può includere lavorazione CNC e finitura; il percorso di lavorazione e
      l'ambito ispettivo vengono concordati in base al disegno del componente finito.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "Revisione HPDC di grandi strutture"
      - "Gestione termica di stampi di grandi dimensioni"
      - "Lavorazione CNC definita per progetto"
    equipment:
      - "Ingombro macchina e stampo confermato all'RFQ"
      - "Metodo di ispezione scelto per progetto"
    applications:
      - "Strutture batterie EV"
      - "Torri ammortizzatore e traverse"
      - "Nodi strutturali"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "Grande pressa per pressofusione ad alta pressione in un reparto produttivo"
      title: "Grandi fusioni strutturali"
    learn_more: ""

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Lavorazione CNC di precisione"
    heading: "Lavorazione CNC di precisione"
    body: |
      La colata è solo metà della storia. Il reparto di lavorazione CNC ad alta precisione interno
      di KingShip completa il componente — foratura, filettatura, fresatura e alesatura delle
      superfici di accoppiamento critiche. Specifiche macchina, setup e fattibilità di ciascuna
      tolleranza vengono confermati per ogni progetto.

      Poiché la lavorazione si trova accanto alla colata, eliminiamo i ritardi di consegna e le
      dispute di qualità che derivano dall'esterno. I riferimenti sono coerenti dal grezzo al pezzo
      finito, i rapporti di primo articolo sono generati sullo stesso piano, e le modifiche di
      progettazione dell'ultimo minuto tornano subito alla cella. Eseguiamo anche operazioni a
      valore aggiunto come filettatura elicoidale, spianatura di boss e alesature a tolleranza
      stretta per superfici di tenuta.

      Per i componenti a tenuta in pressione, metodo, intervallo e campionamento del test di perdita
      vengono concordati nell'ambito del piano ispettivo del progetto.
    materials:
      - "Leghe di alluminio"
      - "Leghe di magnesio"
    processes:
      - "Fresatura, foratura e tornitura CNC"
      - "Foratura e filettatura di precisione"
      - "Pianificazione del test di perdita per progetto"
    equipment:
      - "Attrezzature per lavorazione CNC successiva"
      - "Attrezzature per test di perdita"
    applications:
      - "Superfici di tenuta"
      - "Funzioni di accoppiamento critiche"
      - "Componenti finiti"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "Lavorazione CNC multi-assi di precisione di parti pressofuse a tolleranza stretta"
      title: "Lavorazione CNC di precisione"
    learn_more: "/it/cnc-machining/"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Attrezzature per pressofusione"
    heading: "Attrezzature per pressofusione"
    body: |
      La qualità dello stampo condiziona tutto il processo. Progettazione, alimentazione, raffreddamento
      e pianificazione della manutenzione vengono sviluppati in base al disegno del componente finito
      e ai requisiti produttivi.

      L'ambito di costruzione e manutenzione degli stampi viene confermato per ogni progetto. Uno
      stampo ponte o prototipale può essere valutato quando un programma richiede una validazione
      prima dello stampo di produzione.

      La durata dello stampo dipende dal progetto e viene esaminata in base a progettazione, lega,
      processo, manutenzione e criteri di accettazione.
    materials:
      - "Acciaio per stampi H13"
      - "Materiali per stampi personalizzati"
    processes:
      - "Progettazione e simulazione di stampi"
      - "Ambito di costruzione confermato all'RFQ"
      - "Manutenzione e ricondizionamento"
    equipment:
      - "Revisione CAD/CAM e DFM"
      - "Ambito stampi definito per progetto"
    applications:
      - "Stampi di produzione"
      - "Attrezzature ponte"
      - "Attrezzature di famiglia"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "Processo produttivo integrato verticalmente dalla colata alla finitura"
      title: "Attrezzature e processo integrati"

