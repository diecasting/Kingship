faq:
  heading: "Häufig gestellte Fragen"
  items:
    - question: "Welche Aluminium- und Magnesiumlegierungen gießen Sie?"
      answer: "Gusslegierungen für Aluminium und Magnesium werden anhand von Zeichnung, Anwendung und aktueller Materialverfügbarkeit geprüft. Legierung und Zustand werden für jedes RFQ bestätigt."
    - question: "Welche maximale Maschinen-Schließkraft haben Sie?"
      answer: "Die Maschinenauswahl wird anhand von Bauteilgröße, Formenkonstruktion, Legierung und erforderlichem Schussgewicht bestätigt. Vor dem Start erfolgt eine projektbezogene Machbarkeitsprüfung."
    - question: "Bieten Sie interne CNC-Bearbeitung und Prüfung?"
      answer: "CNC-Nachbearbeitung ist intern verfügbar. Maschinenspezifikationen, Prüfmethoden und Tolerierbarkeit werden für jedes Projekt bestätigt."
    - question: "Sind Sie nach Automobilqualitätsstandards zertifiziert?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd. verfügt über das IATF-16949:2016-Zertifikat T207408 / 0613009 für die Herstellung von Druckguss- und Bearbeitungsteilen, Abschnitt 8.3 ausgeschlossen, sowie das ISO-9001:2015-Zertifikat DZ/CN/2411010Q für Präzisionsmechanikteile und Druckgussformen."
    - question: "Unterstützen Sie DFM (Design for Manufacturability)?"
      answer: "Die DFM-Prüfung kann Füll-, Erstarrungs- und Kühlungssimulationen umfassen, sofern sie zum Projektumfang passen. Werkzeug- und Prozessentscheidungen bleiben von der projektspezifischen Validierung abhängig."
    - question: "Wie lange dauert eine Angebotserstellung?"
      answer: "Für ein klar definiertes RFQ prüfen wir Zeichnung, Fertigungsumfang, Prüfanforderungen und Projektrisiken, bevor wir den Zeitpunkt für das Angebot bestätigen."
    - question: "Bieten Sie Bridge-Tooling für Kleinserien?"
      answer: "Ja. Wir bieten Bridge-Tooling für effiziente Kleinserien-Prototypen und -validierung, bevor ein volles Produktionswerkzeug gebaut wird."

rfq:
  heading: "Angebot anfordern"
  lead: "Senden Sie Zeichnungen und Anforderungen für technische Prüfung und RFQ-Planung."
  body: |
    Teilen Sie uns Material, Wandstärke, Toleranzen, Oberflächenbehandlung und geschätztes
    Jahresvolumen mit. Unser Engineering-Team prüft Ihr Projekt und antwortet mit einem praktischen,
    kostenoptimierten Fertigungsplan.
