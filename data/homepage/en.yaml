      alt: "Vertically integrated manufacturing process from casting to finishing"
      title: "Integrated Tooling & Process"

quality:
  heading: "Quality Control & Certification"
  lead: "A zero-defect mindset backed by international certification and non-destructive testing."
  body: |
    KingShip operates a comprehensive Quality Management System built for automotive, aerospace and
    medical-grade expectations. Our facility is certified to IATF 16949 and ISO 9001, and every
    high-pressure die casting operation is governed by documented process control, statistical
    monitoring and continuous improvement.

    Structural integrity is verified, not assumed. Real-time X-ray detector systems perform
    non-destructive testing to reveal internal porosity, cracks and inclusions that surface
    inspection would miss. Coordinate Measuring Machines (CMM) confirm dimensional accuracy
    against the CAD model, while automated leak testing validates airtightness and fluid-handling
    performance for pressure-sealed components. Finishing steps such as SureTech 650 surface
    treatment complete the downstream process.

    This layered inspection strategy means customers receive parts that are qualified before
    shipment, not discovered defective on the assembly line — protecting your line, your schedule
    and your brand.
  standards:
    - "ISO 9001"
    - "IATF 16949"
  methods:
    - "Real-time X-Ray Inspection"
    - "CMM Dimensional Verification"
    - "Automated Leak Testing"
    - "SureTech 650 Surface Treatment"
  image:
    url: "https://alumcasting.com/wp-content/uploads/2026/05/TF1949-ISO9001-Certification.webp"
    alt: "TF1949 ISO 9001 certification for quality management in die casting"
    title: "ISO 9001 & IATF 16949 Certified"

