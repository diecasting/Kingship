capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Moldeo por inyección de aluminio"
    heading: "Moldeo por inyección de aluminio"
    body: |
      El moldeo por inyección de aluminio a alta presión es la base de nuestra producción. Fundimos una
      amplia gama de componentes estructurales y funcionales en las aleaciones ADC12, A380, A356 y A360,
      equilibrando conductividad térmica, resistencia a la corrosión y estabilidad dimensional. Nuestras
      máquinas en cámara fría abarcan de 400T a 5000T, permitiendo desde carcasas finas y complejas hasta
      grandes piezas estructurales de automoción en un solo disparo.

      Cada programa comienza con una simulación de llenado. Al modelar llenado, solidificación y
      enfriamiento antes de construir el utillaje, eliminamos rechazos en frío, atrapamientos de aire y
      porosidad por contracción en la fase de diseño. Tras el moldeo, los centros CNC internos mantienen
      las superficies de acoplamiento críticas en ±0,01 mm, y operaciones como anodizado, recubrimiento en
      polvo, granallado e impregnación se coordinan en la misma planta.

      Las aplicaciones típicas incluyen carcasas de tren motriz, bandejas y soportes de baterías EV,
      disipadores de calor y carcasas electrónicas.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Moldeo por inyección a alta presión"
      - "Mecanizado CNC"
      - "Anodizado y recubrimiento en polvo"
      - "Impregnación"
    equipment:
      - "Máquinas en cámara fría 400T–5000T"
      - "Centros CNC de 5 ejes"
    applications:
      - "Tren motriz de automoción"
      - "Carcasas de baterías EV"
      - "Disipadores y carcasas"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/A356-aluminum-die-casting-porosity-control.webp"
      alt: "Componente de moldeo por inyección de aluminio A356 bajo control de porosidad"
      title: "Moldeo por inyección de aluminio A356"
    learn_more: "/es/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Moldeo por inyección de magnesio"
    heading: "Moldeo por inyección de magnesio"
    body: |
      El moldeo por inyección de magnesio ofrece la máxima reducción de peso — aproximadamente un tercio
      más ligero que el aluminio con rigidez comparable — y es el material preferido para componentes de
      automoción, aeronáutica y electrónica premium que son críticos de peso. KingShip funde las aleaciones
      AZ91D y AM60B en máquinas dedicadas, con espesor de pared mínimo de 1,0 mm para geometrías complejas.

      La alta resistencia con bajo peso y el excelente blindaje EMI/RFI del magnesio son valiosos para
      soportes de EV, carcasas de sensores y dispositivos portátiles. Protegemos la integridad superficial
      con pasivación y galvanizado, y verificamos el espesor y la calidad interna con inspección por rayos X
      en tiempo real antes del envío.

      Como el moldeo de magnesio exige un control estricto, nuestros ingenieros gestionan la protección del
      baño, la velocidad de inyección y la temperatura del molde para evitar oxidación y grietas en caliente.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Moldeo por inyección de magnesio a alta presión"
      - "Pasivación"
      - "Galvanizado"
    equipment:
      - "Máquinas de magnesio 160T–2250T"
      - "Inspección por rayos X en tiempo real"
    applications:
      - "Soportes de automoción"
      - "Componentes aeronáuticos"
      - "Dispositivos portátiles premium"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/lightweight-magnesium-die-casting-3c-aerospace-parts.webp"
      alt: "Piezas de magnesio ligeras para aeronáutica y electrónica 3C"
      title: "Moldeo por inyección de magnesio"
    learn_more: "/es/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Colada semi-sólida (Rheocasting)"
    heading: "Colada semi-sólida (Rheocasting)"
    body: |
      El rheocasting semi-sólido es nuestra solución para piezas que deben combinar baja porosidad, alta
      ductilidad y capacidad de tratamiento térmico. Al conformar la aleación en estado semi-sólido — una
      suspensión de glóbulos sólidos en líquido — se eliminan casi por completo los atrapamientos de gas y
      la porosidad por contracción que el moldeo convencional no evita.

      El resultado es una pieza que puede recibir tratamiento térmico T5 o T6, soldarse y mecanizarse,
      abriendo la puerta a componentes estructurales de seguridad. KingShip opera un sistema Yizumi de
      rheocasting semi-sólido y valida la uniformidad microestructural con metalografía y rayos X en tiempo real.

      El rheocasting es especialmente atractivo para nodos estructurales de EV y aeronáutica, y componentes
      donde la vida a fatiga es decisiva.
    materials:
      - "A356 Rheocast"
      - "Barbotinas de aluminio personalizadas"
    processes:
      - "Rheocasting semi-sólido"
      - "Tratamiento térmico T5 / T6"
      - "Validación metalográfica"
    equipment:
      - "Sistema Yizumi de rheocasting semi-sólido"
      - "Prueba de porosidad por rayos X"
    applications:
      - "Nodos estructurales EV"
      - "Soportes aeronáuticos"
      - "Componentes críticos de fatiga"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/semi-solid-casting-microstructure-vs-xray-porosity-test.webp"
      alt: "Microestructura rheocast semi-sólida frente a prueba de porosidad por rayos X"
      title: "Microestructura rheocast semi-sólida"

  - id: "5000t-structural-casting"
    anchor: "capability-5000t"
    name: "Piezas estructurales de 5000T"
    heading: "Piezas estructurales de 5000T"
    body: |
      Nuestra máquina de moldeo por inyección en cámara fría de 5000 toneladas está construida para las
      piezas estructurales más grandes y de pared más delgada de las industrias automotriz y de EV. Las
      piezas estructurales grandes — como rieles laterales de bandejas de baterías, torres de amortiguación
      y travesaños — consolidan lo que antes eran docenas de chapa y soldaduras en una sola pieza de aluminio
      ligera y rígida.

      Producir estas piezas exige más que tonelaje: requiere control preciso del disparo, gestión térmica de
      un utillaje muy grande y ventanas de proceso disciplinadas para controlar la deformación y la porosidad.
      KingShip modela todo el sistema de colada y valida las primeras piezas con CMM, rayos X y pruebas de fugas.

      Al integrar el moldeo estructural grande con el mecanizado CNC interno, entregamos un componente
      terminado y listo para montaje, no solo una pieza bruta.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "Moldeo por inyección de 5000T"
      - "Gestión térmica de utillaje grande"
      - "Mecanizado CNC listo para montaje"
    equipment:
      - "Máquina de 5000T en cámara fría"
      - "CMM de gran formato"
    applications:
      - "Estructuras de baterías EV"
      - "Torres de amortiguación y travesaños"
      - "Nodos estructurales"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2022/10/5000t-aluminum-die-casting-machine-large-structural-parts.webp"
      alt: "Máquina de 5000 toneladas produciendo grandes piezas estructurales de automoción"
      title: "Piezas estructurales de 5000T"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Mecanizado CNC de precisión"
    heading: "Mecanizado CNC de precisión"
    body: |
      El moldeo es solo la mitad de la historia. El centro CNC interno de KingShip completa el componente —
      taladrando, roscando, fresando y mandrinando las superficies de acoplamiento críticas que el moldeo
      no alcanza. Nuestros centros de 3, 4 y 5 ejes de alta velocidad mantienen tolerancias de ±0,01 mm.

      Al estar el mecanizado junto al moldeo, eliminamos retrasos y disputas de calidad del outsourcing.
      Las referencias son consistentes del molde al corte, y los cambios de diseño fluyen directamente a la
      célula. También realizamos operaciones de roscado helicoidal y mandrinado de altas tolerancias.

      Para componentes sellados por presión, añadimos pruebas de fugas automatizadas tras el mecanizado,
      confirmando la estanqueidad antes de que la pieza salga de la planta.
    materials:
      - "Aleaciones de aluminio"
      - "Aleaciones de magnesio"
    processes:
      - "Mecanizado CNC 3 / 4 / 5 ejes"
      - "Taladrado y roscado de precisión"
      - "Prueba de fugas automatizada"
    equipment:
      - "Centros CNC de 5 ejes de alta velocidad"
      - "Equipo de prueba de fugas automatizada"
    applications:
      - "Superficies de estanqueidad"
      - "Funciones de acoplamiento críticas"
      - "Componentes terminados"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/precision-multi-axis-cnc-machining-tight-tolerance-parts.webp"
      alt: "Mecanizado CNC multi-eje de precisión de piezas inyectadas de alta tolerancia"
      title: "Mecanizado CNC de precisión"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Utillaje de moldeo por inyección"
    heading: "Utillaje de moldeo por inyección"
    body: |
      La calidad del utillaje lo define todo. KingShip opera un taller de utillaje interno con CAD/CAM
      avanzado, Pro/E, UG y simulación Moldflow para diseñar y construir utillajes que duran más y producen
      piezas más limpias. Los sistemas optimizados de bebedero y enfriamiento reducen el ciclo, minimizan la
      porosidad y extienden la vida útil por encima de 100.000 disparos.

      Mantener el utillaje en nuestras instalaciones significa iteración más rápida: cambios, mantenimiento y
      retoques sin plazos de terceros. También ofrecemos utillaje puente para prototipos de bajo volumen antes
      de comprometer un utillaje de producción completo.

      Un utillaje bien diseñado es el seguro más económico contra el desecho y los fallos de campo.
    materials:
      - "Acero para utillaje H13"
      - "Materiales de utillaje personalizados"
    processes:
      - "Diseño y simulación de utillajes"
      - "Fabricación interna de utillajes"
      - "Mantenimiento y retoques"
    equipment:
      - "CAD/CAM y Moldflow"
      - "Taller CNC de utillajes"
    applications:
      - "Utillajes de producción"
      - "Utillaje puente"
      - "Utillaje de familia"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/vertically-integrated-manufacturing-process-casting-to-finishing.webp"
      alt: "Proceso de fabricación verticalmente integrado del moldeo al acabado"
      title: "Utillaje integrado"

quality:
  heading: "Control de calidad y certificación"
  lead: "Una mentalidad de cero defectos respaldada por certificación internacional y ensayo no destructivo."
  body: |
    KingShip opera un sistema de gestión de calidad integral para expectativas de automoción, aeronáutica
    y medicina. Nuestras instalaciones están certificadas según IATF 16949 e ISO 9001, y cada operación de
    moldeo por inyección se rige por control de proceso documentado y mejora continua.

    La integridad estructural se verifica, no se asume. Los detectores de rayos X en tiempo real realizan
    ensayos no destructivos para revelar porosidad interna, grietas e inclusiones. Las máquinas de medición
    por coordenadas (CMM) confirman la precisión dimensional, mientras las pruebas de fugas validan la
    estanqueidad de componentes sellados por presión.

    Esta estrategia por capas significa que los clientes reciben piezas calificadas antes del envío.
  standards:
    - "ISO 9001"
    - "IATF 16949"
  methods:
    - "Inspección por rayos X en tiempo real"
    - "Verificación dimensional CMM"
    - "Prueba de fugas automatizada"
    - "Tratamiento superficial SureTech 650"
  image:
    url: "https://alumcasting.com/wp-content/uploads/2026/05/TF1949-ISO9001-Certification.webp"
    alt: "Certificación TF1949 ISO 9001 para gestión de calidad en moldeo por inyección"
    title: "Certificado ISO 9001 e IATF 16949"

