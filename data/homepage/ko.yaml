      - "임계 결합 특징"
      - "완제품 부품"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "엄격한 공차의 다이캐스트 부품을 정밀 다축 CNC 가공"
      title: "정밀 CNC 가공"
    learn_more: "/ko/cnc-machining/"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "다이캐스팅 금형"
    heading: "다이캐스팅 금형"
    body: |
      금형 품질은 후속 공정 전체에 영향을 줍니다. 금형 설계, 게이팅, 냉각 및 유지보수 계획은 완제품
      도면과 생산 요구에 따라 개발합니다.

      금형 제작 및 유지보수 범위는 프로젝트별로 확인합니다. 양산 금형 전에 검증이 필요한 프로그램에는
      브리지 또는 시제품 금형을 평가할 수 있습니다.

      금형 수명은 프로젝트에 따라 달라지며 금형 설계, 합금, 공정, 유지보수 및 승인 기준에 따라
      검토합니다.
    materials:
      - "H13 금형강"
      - "맞춤형 금형 소재"
    processes:
      - "금형 설계 및 시뮬레이션"
      - "RFQ에서 확인하는 금형 제작 범위"
      - "유지보수 및 리컨디셔닝"
    equipment:
      - "CAD/CAM 및 DFM 검토"
      - "프로젝트별 금형 제작 범위"
    applications:
      - "생산 금형"
      - "브리지 금형"
      - "패밀리 금형"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "주조에서 마감까지 수직 계열화된 제조 공정"
      title: "통합 금형 및 공정"

quality:
  heading: "품질 관리 및 인증"
  lead: "합의된 도면 요구, 검사 범위 및 문서화된 승인 기준에 따른 품질 계획."
  body: |
