faq:
  heading: "よくある質問"
  items:
    - question: "どのアルミ・マグネシウム合金を鋳造しますか？"
      answer: "アルミニウムはADC12・A380・A356・A360、マグネシウムはAZ91D・AM60Bを鋳造します。レオキャストスラリーやカスタム組成も対応可能です。"
    - question: "最大のマシントン数は？"
      answer: "最大は5000トンのコールドチャンバー高圧ダイカストマシンで、メートル規模の薄肉構造部品を生産できます。"
    - question: "社内CNC加工と検査に対応していますか？"
      answer: "はい。3・4・5軸CNC加工センターに加え、CMM寸法検証、リアルタイムX線気孔検査、自動漏れ試験を社内で実施します。"
    - question: "自動車品質基準の認証を取得していますか？"
      answer: "KingShip はISO 9001およびIATF 16949を取得しており、自動車・航空宇宙・医療向けの品質マネジメントシステムを構築しています。"
    - question: "DFM（製造性設計）に対応していますか？"
      answer: "もちろんです。金型製作前の設計段階でMagma・Moldflowシミュレーションを実施し、気孔やコールドショットを排除します。"
    - question: "見積もりのリードタイムは？"
      answer: "図面と要件の明確なRFQについては、通常24時間以内に技術レビューと正式見積もりをご返信します。"
    - question: "小ロット向けブリッジ金型に対応していますか？"
      answer: "はい。本格量産金型に踏み切る前の小ロット試作・検証向けにブリッジ金型を提供します。"

