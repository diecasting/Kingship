# ==========================================================================
# company.yaml — KingShip company identity for the GEO Schema Engine
# Consumed by layouts/partials/schema/*.html (NO hardcoded JSON-LD in pages).
# Edit this file to update Organization / Manufacturer / Service / WebSite
# structured data across all languages.
# ==========================================================================

# --- Core identity ---
name: "Kingship (Dongguan) Precision Manufacturing Co., Ltd."   # legal name (used as legalName)
shortName: "KingShip"                                          # display name (Organization.name)
brand: "AlumCasting"
url: "https://kingship.alumcasting.com"
wordpressAuthority: "https://alumcasting.com/"

# --- Visual assets (must return HTTP 200) ---
logo: "https://kingship.alumcasting.com/favicon.png"
images:
  - "https://kingship.alumcasting.com/img/high-precision-cnc-workshop.webp"
  - "https://kingship.alumcasting.com/img/x-ray-detector.webp"

# --- Postal address ---
address:
  locality: "Dongguan"
  region: "Guangdong"
  country: "CN"

# --- Capabilities / expertise (ManufacturingBusiness.knowsAbout) ---
knowsAbout:
  - "Aluminum Die Casting (ADC12, A356, A380)"
  - "Magnesium Die Casting (AZ91D, AM60B)"
  - "Semi-Solid Rheocasting"
  - "High-Precision CNC Post-Processing"
  - "Non-Destructive Testing via real-time X-ray"
  - "Airtightness and pressure leak testing"

# --- Certifications ---
certifications:
  - "ISO 9001"
  - "IATF 16949"

# --- Sales contact point ---
contactPoint:
  contactType: "sales"
  url: "https://kingship.alumcasting.com/contact/"

