intro:
  heading: "Quiénes somos"
  lead: "Un fabricante B2B de moldeo por inyección verticalmente integrado, de la fundición al componente terminado."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. es un proveedor B2B especializado en moldeo
    por inyección a alta presión de aleaciones de aluminio y magnesio, mecanizado CNC interno,
    colada semi-sólida (rheocasting) y ingeniería de utillaje profesional. Durante más de dos décadas
    hemos ayudado a clientes de automoción, vehículos eléctricos, aeronáutica, medicina e industria a
    convertir geometrías exigentes en piezas de producción repetibles y de alta integridad.

    No somos una empresa comercial. Cada pieza se produce en nuestras propias instalaciones de Dongguan,
    donde células modernas de moldeo por inyección en cámara fría se integran con extracción robotizada
    totalmente automatizada, detección de porosidad por rayos X en tiempo real y un centro de mecanizado
    CNC de alta precisión. Esta integración vertical nos permite controlar la precisión dimensional, la
    calidad superficial y el plazo de entrega en todo el proceso — diseño, simulación, moldeo, mecanizado,
    acabado e inspección — bajo un único sistema de gestión de calidad certificado según ISO 9001 e IATF 16949.

    Nuestro equipo de ingeniería colabora con los clientes desde la primera revisión DFM, utilizando
    simulación Magma y Moldflow para eliminar rechazos en frío, atrapamiento de aire y porosidad por
    contracción antes de fabricar el primer utillaje. El resultado es un ciclo de desarrollo más corto,
    un menor coste por pieza y componentes estructurales que se califican a la primera.

