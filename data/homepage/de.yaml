faq:
  heading: "Häufig gestellte Fragen"
  items:
    - question: "Welche Aluminium- und Magnesiumlegierungen gießen Sie?"
      answer: "Wir gießen die Aluminiumlegierungen ADC12, A380, A356 und A360 sowie die Magnesiumlegierungen AZ91D und AM60B. Rheoguss-Breie und Sonderzusammensetzungen auf Anfrage."
    - question: "Welche maximale Maschinen-Schließkraft haben Sie?"
      answer: "Unsere größte Maschine ist eine 5000-Tonnen-Kaltkammer-Hochdruck-Druckgussmaschine, die meter große dünnwandige Strukturbauteile fertigen kann."
    - question: "Bieten Sie interne CNC-Bearbeitung und Prüfung?"
      answer: "Ja. Wir betreiben 3-, 4- und 5-Achs-CNC-Bearbeitungszentren sowie CMM-Maßprüfung, Echtzeit-Röntgen-Porositätsprüfung und automatische Lecktests."
    - question: "Sind Sie nach Automobilqualitätsstandards zertifiziert?"
      answer: "KingShip ist nach ISO 9001 und IATF 16949 zertifiziert; unser Qualitätsmanagementsystem ist für Automobil-, Luftfahrt- und Medizintechnik-Anforderungen ausgelegt."
    - question: "Unterstützen Sie DFM (Design for Manufacturability)?"
      answer: "Ja. Wir führen Magma- und Moldflow-Simulation in der Designphase durch, um Porosität und kalte Läufe vor dem Werkzeugbau zu eliminieren."
    - question: "Wie lange dauert eine Angebotserstellung?"
      answer: "Für ein klares RFQ mit Zeichnungen und Anforderungen liefern wir in der Regel innerhalb von 24 Stunden eine Engineering-Bewertung und ein formelles Angebot."
    - question: "Bieten Sie Bridge-Tooling für Kleinserien?"
      answer: "Ja. Wir bieten Bridge-Tooling für effiziente Kleinserien-Prototypen und -validierung, bevor ein volles Produktionswerkzeug gebaut wird."

rfq:
  heading: "Angebot anfordern"
  lead: "Senden Sie Ihre Zeichnungen und Anforderungen – innerhalb von 24 Stunden erhalten Sie eine Engineering-Bewertung und ein formelles Angebot."
  body: |
    Teilen Sie uns Material, Wandstärke, Toleranzen, Oberflächenbehandlung und geschätztes
    Jahresvolumen mit. Unser Engineering-Team prüft Ihr Projekt und antwortet mit einem praktischen,
    kostenoptimierten Fertigungsplan.
