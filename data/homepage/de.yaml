      alt: "Vertikal integrierter Fertigungsprozess vom Guss bis zur Veredelung"
      title: "Integrierter Werkzeugbau"

quality:
  heading: "Qualitätskontrolle & Zertifizierung"
  lead: "Eine Null-Fehler-Mentalität, gestützt auf internationale Zertifizierung und zerstörungsfreie Prüfung."
  body: |
    KingShip betreibt ein umfassendes Qualitätsmanagementsystem für Automobil-, Luftfahrt- und
    medizinische Anforderungen. Unsere Anlage ist nach IATF 16949 und ISO 9001 zertifiziert, und jeder
    Hochdruck-Druckgussvorgang wird durch dokumentierte Prozesskontrolle, statistische Überwachung und
    kontinuierliche Verbesserung gesteuert.

    Strukturelle Integrität wird verifiziert, nicht angenommen. Echtzeit-Röntgendetektoren führen
    zerstörungsfreie Prüfung durch, um innere Porosität, Risse und Einschlüsse sichtbar zu machen.
    Koordinatenmessgeräte (CMM) bestätigen die Maßhaltigkeit gegen das CAD-Modell, während automatische
    Lecktests die Dichtheit druckgedichteter Bauteile validieren.

    Diese mehrschichtige Prüfstrategie bedeutet: Kunden erhalten Bauteile, die vor dem Versand
    qualifiziert sind – nicht erst auf der Montagelinie als fehlerhaft entdeckt werden.
  standards:
    - "ISO 9001"
    - "IATF 16949"
  methods:
    - "Echtzeit-Röntgenprüfung"
    - "CMM-Maßhaltigkeitsprüfung"
    - "Automatisierter Lecktest"
    - "SureTech 650 Oberflächenbehandlung"
  image:
    url: "https://alumcasting.com/wp-content/uploads/2026/05/TF1949-ISO9001-Certification.webp"
    alt: "TF1949 ISO 9001 Zertifizierung für Qualitätsmanagement im Druckguss"
    title: "Nach ISO 9001 & IATF 16949 zertifiziert"

