faq:
  heading: "Frequently Asked Questions"
  items:
    - question: "What aluminum and magnesium alloys do you cast?"
      answer: "Aluminum and magnesium casting grades are reviewed against the drawing, application and current material availability. The final alloy and condition are confirmed for each RFQ."
    - question: "What is your maximum die casting machine tonnage?"
      answer: "Machine selection is confirmed against part size, die design, alloy and required shot weight. A project-specific feasibility review is completed before launch."
    - question: "Do you provide in-house CNC machining and inspection?"
      answer: "CNC post-machining is available in-house. Machine specifications, inspection methods and tolerance feasibility are confirmed for each project."
    - question: "Are you certified to automotive quality standards?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd. holds IATF 16949:2016 certificate T207408 / 0613009 for the manufacture of die-cast and machined parts, with Clause 8.3 excluded, and ISO 9001:2015 certificate DZ/CN/2411010Q for precision mechanical parts and die-casting molds."
    - question: "Can you help with design for manufacturability (DFM)?"
      answer: "DFM can include fill, solidification and cooling simulation where it fits the project scope. Tooling and process decisions remain subject to part-specific validation."
    - question: "What is the typical quotation lead time?"
      answer: "For a well-defined RFQ with drawings and requirements, we review the manufacturing scope, inspection requirements and project risks before confirming quotation timing."
    - question: "Do you support low-volume bridge tooling?"
      answer: "Yes. We offer bridge tooling for efficient small-batch prototyping and validation before committing to a full production die."

rfq:
  heading: "Request a Quote"
  lead: "Send your drawings and requirements for engineering review and RFQ planning."
  body: |
    Tell us about your material, wall thickness, tolerances, surface treatment and estimated annual
    volume. Our engineering team will review your project and respond with a practical,
    cost-optimized manufacturing plan.
