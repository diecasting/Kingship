      Umfang von Werkzeugbau und Wartung wird für jedes Projekt bestätigt. Für Programme, die vor der
      Serienform eine Validierung benötigen, kann Bridge- oder Prototypenwerkzeug bewertet werden.

      Die Werkzeugstandzeit ist projektabhängig und wird anhand von Formenkonstruktion, Legierung, Prozess,
      Wartung und Abnahmekriterien geprüft.
