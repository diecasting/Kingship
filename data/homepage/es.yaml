faq:
  heading: "Preguntas frecuentes"
  items:
    - question: "¿Qué aleaciones de aluminio y magnesio moldea?"
      answer: "Moldeamos las aleaciones de aluminio ADC12, A380, A356 y A360, y las de magnesio AZ91D y AM60B. También ofrecemos barbotinas rheocast y composiciones personalizadas."
    - question: "¿Cuál es su tonelaje máximo de máquina?"
      answer: "Nuestra máquina más grande es una de moldeo por inyección en cámara fría de 5000 toneladas, capaz de producir piezas estructurales de pared delgada a escala métrica."
    - question: "¿Ofrecen mecanizado e inspección CNC internos?"
      answer: "Sí. Operamos centros CNC de 3, 4 y 5 ejes, además de verificación dimensional CMM, inspección de porosidad por rayos X en tiempo real y pruebas de fugas automatizadas."
    - question: "¿Están certificados según estándares de calidad automotriz?"
      answer: "KingShip está certificado según ISO 9001 e IATF 16949, con un sistema de gestión de calidad orientado a automoción, aeronáutica y medicina."
    - question: "¿Ayudan con el diseño para fabricabilidad (DFM)?"
      answer: "Por supuesto. Realizamos simulación Magma y Moldflow en la fase de diseño para eliminar porosidad y rechazos en frío antes del utillaje."
    - question: "¿Cuánto tarda una cotización?"
      answer: "Para un RFQ claro con planos y requisitos, normalmente respondemos con una revisión de ingeniería y cotización formal en 24 horas."
    - question: "¿Ofrecen utillaje puente para bajo volumen?"
      answer: "Sí. Ofrecemos utillaje puente para prototipos y validación de lotes pequeños antes de comprometer un utillaje de producción completo."

rfq:
  heading: "Solicitar cotización"
  lead: "Envíe sus planos y requisitos — obtenga una revisión de ingeniería y cotización formal en 24 horas."
  body: |
    Cuéntenos sobre su material, espesor de pared, tolerancias, tratamiento superficial y volumen anual
    estimado. Nuestro equipo de ingeniería revisará su proyecto y responderá con un plan de fabricación
    práctico y optimizado en costes.
