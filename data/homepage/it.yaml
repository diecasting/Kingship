intro:
  heading: "Chi siamo"
  lead: "Un produttore B2B verticalmente integrato con pianificazione produttiva e ispettiva specifica per ciascun progetto."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. è un fornitore B2B dedicato di
    pressofusione ad alta pressione in leghe di alluminio e magnesio, lavorazione CNC interna
    post-processo, valutazione dei processi di pressofusione e ingegneria degli stampi. L'azienda supporta programmi
    automotive, veicoli elettrici, industriali e altre applicazioni produttive con ingegneria e
    pianificazione della produzione specifiche per il progetto.

    Non siamo una trading company. Le fusioni vengono prodotte nel nostro stabilimento di Dongguan.
    Pressofusione a camera fredda, lavorazione CNC e metrologia supportano la pianificazione produttiva
    specifica del progetto. Metodi di ispezione, campionamento e documentazione vengono concordati in
    base al disegno e ai requisiti del cliente.

    Il nostro team di ingegneria collabora con i clienti dalla prima revisione DFM e utilizza
    simulazioni di riempimento e solidificazione quando sono pertinenti al progetto. Prima del lancio
    vengono confermati la sequenza produttiva e il piano di ispezione in base a disegno, volume e
    requisiti qualitativi.

