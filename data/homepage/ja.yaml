intro:
  heading: "会社概要"
  lead: "案件ごとの生産計画と検査計画に沿って対応する、垂直統合型B2Bダイカストメーカー。"
  body: |
    KingShip（東莞）精密製造有限公司は、アルミニウム・マグネシウム合金の高圧ダイカスト、社内CNC後処理、
    ダイカスト工程評価、金型エンジニアリングを専門とするB2Bサプライヤーです。自動車、電気自動車（EV）、
    産業機器などの製造プログラムに対し、案件別のエンジニアリングと生産計画で対応します。

    当社は商社ではありません。鋳造品は東莞工場で生産します。コールドチャンバーダイカスト、CNC後加工、
    測定設備により、案件別の生産計画を支援します。検査方法、サンプリング、文書化の範囲は図面と顧客要求に
    基づいて合意します。

    エンジニアリングチームは最初のDFMレビューからお客様と協業し、案件範囲に適する場合は充填・凝固
    シミュレーションを実施します。量産開始前に、図面、数量、品質要件に基づいて工程ルートと検査範囲を
    確定します。

