capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "알루미늄 다이캐스팅"
    heading: "알루미늄 다이캐스팅"
    body: |
      알루미늄 합금 고압 다이캐스팅은 당사 생산의 중추입니다. 당사는 ADC12, A380, A356, A360 합금으로
      구조 및 기능 부품을 폭넓게 주조하며, 까다로운 서비스 환경을 위해 열전도율, 내식성, 치수 안정성을
      균형 있게 맞춥니다. 장비 선택은 부품 크기, 금형 설계, 합금 및 필요한 샷 중량을 기준으로 검토합니다.

      DFM에는 프로젝트 범위에 적합한 경우 충전, 응고 및 냉각 시뮬레이션을 포함할 수 있습니다. CNC 후가공은
      기능면, 홀 및 실링면을 지원하며, 각 공차의 실현 가능성은 특성별로 확인합니다. 2차 공정 가용성은
      RFQ에서 확인합니다.

      전형적인 용도로는 자동차 파워트레인 하우징, EV 배터리 트레이 및 브래킷, 히트 싱크, 조명 하우징,
      전자 인클로저가 있습니다. 최종 합금과 상태는 도면, 프로젝트 요구 및 현재 자재 가용성에 따라
      확인합니다.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "고압 다이캐스팅"
      - "CNC 가공"
      - "아노다이징 및 분체 도장"
      - "함침"
    equipment:
      - "콜드 챔버 HPDC 공정 선택"
      - "프로젝트별 CNC 후가공 범위"
    applications:
      - "자동차 파워트레인"
      - "EV 배터리 하우징"
      - "히트 싱크 및 인클로저"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "기공 제어 검사를 받는 A356 알루미늄 다이캐스트 부품"
      title: "A356 알루미늄 다이캐스팅"
    learn_more: "/ko/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "마그네슘 다이캐스팅"
    heading: "마그네슘 다이캐스팅"
    body: |
      마그네슘 다이캐스팅은 최대의 중량 절감을 제공합니다 — 동등한 강성 대비 알루미늄보다 약 3분의 1
      가볍기 때문에 중량에 민감한 자동차, 항공우주, 프리미엄 전자 부품의 선호 소재입니다. KingShip은
      마그네슘 프로젝트는 생산 범위를 확정하기 전에 합금, 장비 구성, 박벽 형상 실현성 및 부식 전략을
      검토합니다.

      마그네슘의 우수한 비강도와 EMI/RFI 차폐 성능은 전기차 브래킷, 센서 하우징, 드론 프레임, 휴대용
      기기에 가치가 있습니다. 당사는 마그네슘 내식성을 위해 최적화된 피막 처리 및 전기 도금 공정으로
      표면 처리와 검사 방법은 합금, 용도 및 도면 요구에 따라 선택합니다.

      마그네슘 주조는 엄격한 공정 제어를 요구하므로, 당사 엔지니어는 산화와 핫 크랙을 방지하기 위해
      용탕 보호, 사출 속도, 금형 온도를 면밀히 관리합니다. 그 결과 경량이고 치수 안정적인 부품이 되어
      OEM이 구조 성능을 희생하지 않고도 공격적인 차량 중량 및 주행 거리 목표를 달성하도록 돕습니다.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "마그네슘 고압 다이캐스팅"
      - "피막 처리"
      - "전기 도금"
    equipment:
      - "마그네슘 HPDC 공정 경로 검토"
      - "프로젝트별 X선 검사 계획"
    applications:
      - "자동차 브래킷"
      - "항공우주 부품"
      - "프리미엄 휴대용 기기"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "경량 마그네슘 다이캐스트 항공우주 및 3C 전자 부품"
      title: "마그네슘 다이캐스트 부품"
    learn_more: "/ko/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "반용융 레오캐스팅"
    heading: "반용융 레오캐스팅"
    body: |
      반용융 레오캐스팅은 제어된 슬러리 형성, 열처리성 및 명확한 기공 전략이 필요한 프로젝트를 위한
      엔지니어링 방식입니다. 공정 계획은 합금, 형상, 금형 설계 및 승인 기준에 따라 달라집니다.

      열처리, 용접, 가공 및 검사 요구는 용도별로 검토합니다. 레오캐스팅 프로젝트를 수락하기 전에 현재
      생산 능력, 장비 및 합금 적격성을 확인합니다.

      레오캐스팅은 공정 메커니즘, 재료 거동 및 검사 계획을 함께 고려해야 하는 EV 및 항공우주 구조
      프로젝트에서 평가합니다.
    materials:
      - "RFQ에서 확인하는 알루미늄 반고체 소재"
      - "프로젝트별 공정 검토"
    processes:
      - "반용융 레오캐스팅"
      - "T5 / T6 열처리"
      - "금속 조직 검증"
    equipment:
      - "RFQ에서 확인하는 반고체 공정 경로"
      - "프로젝트별 X선 계획"
    applications:
      - "EV 구조 노드"
      - "항공우주 브래킷"
      - "피로 임계 부품"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "알루미늄 구조 다이캐스트 부품"
      title: "알루미늄 구조 주조"
    learn_more: "/ko/semi-solid-rheocasting/"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "대형 구조 주조 검토"
    heading: "대형 구조 주조 검토"
    body: |
      대형 구조 주조는 여러 스탬핑 또는 용접 부품을 하나의 경량 부품으로 통합할 수 있습니다. 예로는
      배터리 트레이 사이드 레일, 쇼크 타워, 터널 하우징, 크로스멤버가 있습니다.

      이러한 부품에는 정밀한 샷 제어, 대형 금형의 열 관리, 변형과 기공을 억제하는 관리된 공정 창이
      필요합니다. 타당성 확정 전에 장비·금형 크기, 샷 중량, 합금 및 검사 계획을 검토합니다.

      공정 계획에는 CNC 후가공과 마감을 포함할 수 있으며, 가공 경로와 검사 범위는 완제품 도면에
      따라 합의합니다.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "대형 구조 HPDC 프로젝트 검토"
      - "대형 금형 열 관리"
      - "프로젝트별 CNC 후가공"
    equipment:
      - "RFQ에서 확인하는 장비·금형 크기"
      - "프로젝트별 검사 방법"
    applications:
      - "EV 배터리 구조물"
      - "쇼크 타워 및 크로스멤버"
      - "구조 노드"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "생산 현장의 대형 고압 다이캐스팅 설비"
      title: "대형 구조 주조 검토"
    learn_more: ""

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "정밀 CNC 가공"
    heading: "정밀 CNC 가공"
    body: |
      주조는 이야기의 절반일 뿐입니다. KingShip의 사내 고정밀 CNC 가공장은 다이캐스팅 공정이 도달할 수
      없는 임계 결합 면을 드릴, 탭, 밀링, 보어링하여 부품을 완성합니다. 장비 사양, 셋업 및 각 공차의
      실현 가능성은 프로젝트별로 확인합니다.

      가공이 주조 옆에 있기 때문에, 외주화로 인한 인도 지연과 품질 분쟁을 제거합니다. 기준점은 주조에서
      가공까지 일관되게 유지되고, 초도품 보고서는 동일한 현장에서 생성되며, 마지막 순간의 설계 변경은
      즉시 셀로 피드백됩니다. 또한 밀폐면을 위한 나선 탭, 보스 페이싱, 엄격한 공차 보어링과 같은 부가
      가치 작업을 수행합니다.

      압력 밀봉 부품은 누수 시험 방법, 범위 및 샘플링을 프로젝트 검사 계획의 일부로 합의합니다.
    materials:
      - "알루미늄 합금"
      - "마그네슘 합금"
    processes:
      - "CNC 밀링, 드릴링 및 선삭"
      - "정밀 드릴링 및 탭핑"
      - "프로젝트별 누수 시험 계획"
    equipment:
      - "CNC 후가공 설비"
      - "누수 시험 설비"
    applications:
