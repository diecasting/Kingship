capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Moulage d'aluminium"
    heading: "Moulage d'aluminium"
    body: |
      Le moulage sous pression d'aluminium est la base de notre production. Nous coulons un large éventail
      de composants structurels et fonctionnels dans les alliages ADC12, A380, A356 et A360, en équilibrant
      conductivité thermique, résistance à la corrosion et stabilité dimensionnelle. Le choix de la machine
      est étudié selon la taille de la pièce, le moule, l'alliage et le poids de coulée requis.

      Le DFM peut inclure des simulations de remplissage, de solidification et de refroidissement lorsque
      cela correspond au périmètre. L'usinage CNC complémentaire traite les faces fonctionnelles, les alésages
      et les surfaces d'étanchéité ; la faisabilité de chaque tolérance est définie par caractéristique.
      La disponibilité des procédés secondaires est confirmée lors du RFQ.

      Les applications typiques incluent les carters de groupe motopropulseur, les berceaux et supports de
      batteries VE, les dissipateurs thermiques et les carters électroniques. L'alliage et l'état final sont
      confirmés selon le plan, les exigences du projet et la disponibilité actuelle des matières.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Moulage sous pression haute pression"
      - "Usinage CNC"
      - "Anodisation et revêtement poudre"
      - "Imprégnation"
    equipment:
      - "Choix du procédé HPDC en chambre froide"
      - "Périmètre d'usinage CNC par projet"
    applications:
      - "Groupe motopropulseur"
      - "Batteries VE"
      - "Dissipateurs et carters"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "Composant moulé aluminimum A356 sous contrôle de porosité"
      title: "Moulage d'aluminium A356"
    learn_more: "/fr/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Moulage de magnésium"
    heading: "Moulage de magnésium"
    body: |
      Le moulage de magnésium offre la réduction de poids maximale — environ un tiers plus léger que
      l'aluminium à rigidité comparable — et est le matériau de choix pour les composants automobiles,
      aéronautiques et électroniques premium critiques en poids. Les projets magnésium sont étudiés selon
      l'alliage, la configuration de machine, la faisabilité des parois minces et la stratégie anticorrosion
      avant confirmation du périmètre de production.

      La résistance élevée à poids faible et le blindage EMI/RFI excellents du magnésium sont précieux pour
      les supports VE, les carters de capteurs et les appareils portables. Le traitement de surface et les
      méthodes de contrôle sont choisis selon l'alliage, l'application et les exigences du plan.

      Comme le moulage du magnésium exige un contrôle strict, nos ingénieurs gèrent la protection du bain, la
      vitesse d'injection et la température du moule pour éviter oxydation et fissures à chaud.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Moulage sous pression de magnésium"
      - "Passivation"
      - "Galvanoplastie"
    equipment:
      - "Étude de la gamme HPDC magnésium"
      - "Planification des rayons X par projet"
    applications:
      - "Supports automobiles"
      - "Composants aéronautiques"
      - "Appareils portables premium"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "Pièces magnésium légères pour aéronautique et électronique 3C"
      title: "Moulage de magnésium"
    learn_more: "/fr/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Rheocasting semi-solide"
    heading: "Rheocasting semi-solide"
    body: |
      Le rheocasting semi-solide est une voie d'ingénierie destinée aux projets nécessitant une formation
      contrôlée de la pâte, une aptitude au traitement thermique et une stratégie de porosité définie. Le plan
      de procédé dépend de l'alliage, de la géométrie, du moule et des critères d'acceptation.

      Les exigences de traitement thermique, de soudage, d'usinage et de contrôle sont étudiées pour chaque
      application. La capacité de production, l'équipement et la qualification des alliages sont confirmés
      avant l'acceptation d'un projet de rheocasting.

      Le rheocasting est évalué pour les projets structurels VE et aéronautiques qui nécessitent une réflexion
      commune sur le mécanisme du procédé, le comportement des matériaux et le plan de contrôle.
    materials:
      - "Nuance d'aluminium semi-solide confirmée au RFQ"
      - "Étude de procédé propre au projet"
    processes:
      - "Rheocasting semi-solide"
      - "Traitement thermique T5 / T6"
      - "Validation métallographique"
    equipment:
      - "Gamme semi-solide confirmée au RFQ"
      - "Planification rayons X par projet"
    applications:
      - "Nœuds structurels VE"
      - "Supports aéronautiques"
      - "Composants critiques fatigue"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "Composant structurel en aluminium moulé"
      title: "Moulage structurel en aluminium"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "Grandes pièces structurelles"
    heading: "Grandes pièces structurelles"
    body: |
      Les grandes pièces structurelles peuvent regrouper plusieurs composants emboutis ou soudés dans une
      seule pièce légère. Les exemples comprennent les rails latéraux de berceaux de batteries, les tours
      d'amortissement, les carters de tunnel et les traverses.

      Ces pièces exigent un contrôle précis de l'injection, une gestion thermique d'un grand moule et des
      fenêtres de procédé maîtrisées pour limiter la déformation et la porosité. L'étude d'ingénierie prend en
      compte l'encombrement machine et moule, le poids de coulée, l'alliage et le plan de contrôle avant de
      confirmer la faisabilité.

      Le plan de fabrication peut inclure l'usinage CNC et la finition ; la gamme d'usinage et le périmètre
      de contrôle sont convenus selon le plan de la pièce finie.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "Étude HPDC des grandes structures"
      - "Gestion thermique grand moule"
      - "Usinage CNC défini par projet"
    equipment:
      - "Encombrement machine et moule confirmé au RFQ"
      - "Méthode de contrôle choisie par projet"
    applications:
      - "Structures batteries VE"
      - "Tours amortissement et traversants"
      - "Nœuds structurels"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "Grande machine de moulage sous pression dans un atelier de production"
      title: "Grandes pièces structurelles"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Usinage CNC de précision"
    heading: "Usinage CNC de précision"
    body: |
      Le moulage n'est que la moitié de l'histoire. Le centre CNC interne de KingShip complète la pièce —
      perçage, taraudage, fraisage et alésage des surfaces d'accouplement critiques que le moulage n'atteint
      pas. Les spécifications de machine, le montage et la faisabilité de chaque tolérance sont confirmés
      pour chaque projet.

      L'usinage étant à côté du moulage, nous supprimons les retards et litiges de sous-traitance. Les
      références sont cohérentes du moulage à la coupe, et les modifications de conception remontent
      immédiatement à la cellule. Nous réalisons aussi taraudage hélicoïdal et alésage de haute tolérance.

      Pour les composants étanches sous pression, la méthode, la plage et l'échantillonnage du test
      d'étanchéité sont convenus dans le plan de contrôle du projet.
    materials:
      - "Alliages d'aluminium"
      - "Alliages de magnésium"
    processes:
      - "Fraisage, perçage et tournage CNC"
      - "Perçage et taraudage de précision"
      - "Planification du test d'étanchéité"
    equipment:
      - "Équipement d'usinage CNC complémentaire"
      - "Équipement de test d'étanchéité"
    applications:
      - "Surfaces d'étanchéité"
      - "Fonctions d'accouplement critiques"
      - "Composants finis"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "Usinage CNC multi-axes de précision de pièces moulées à haute tolérance"
      title: "Usinage CNC de précision"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Outillage de moulage"
    heading: "Outillage de moulage"
    body: |
      La qualité du moule conditionne tout le reste. La conception, l'alimentation, le refroidissement et la
      planification de la maintenance sont développés selon le plan de la pièce finie et les exigences de
      production.

      Le périmètre de fabrication et de maintenance de l'outillage est confirmé pour chaque projet. Un
      outillage pont ou prototype peut être étudié lorsqu'un programme doit être validé avant le moule de série.

      La durée de vie du moule dépend du projet et est étudiée selon la conception, l'alliage, le procédé,
      la maintenance et les critères d'acceptation.
    materials:
      - "Acier d'outillage H13"
      - "Matériaux d'outillage personnalisés"
    processes:
      - "Conception et simulation d'outillage"
      - "Périmètre d'outillage confirmé au RFQ"
      - "Maintenance et rénovation"
    equipment:
      - "Revue CAO/FAO et DFM"
      - "Périmètre d'outillage défini par projet"
    applications:
      - "Outillages de production"
      - "Outillage pont"
      - "Outillage de famille"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "Processus de fabrication verticalement intégré du moulage à la finition"
      title: "Outillage intégré"

quality:
  heading: "Contrôle qualité et certification"
  lead: "Planification qualité fondée sur les exigences du plan, le périmètre de contrôle et des critères d'acceptation documentés."
  body: |
    Kingship (Dongguan) Precision Manufacturing Co., Ltd. détient le certificat IATF 16949:2016
    T207408 / 0613009 pour la fabrication de pièces moulées et usinées, avec la conception produit selon
    l'article 8.3 exclue. Le certificat ISO 9001:2015 DZ/CN/2411010Q couvre les pièces mécaniques de
    précision et les moules de fonderie.

    Les méthodes de contrôle disponibles comprennent les rayons X, la MMT et les essais d'étanchéité et de
    pression selon les exigences du projet. Les caractéristiques à contrôler, la fréquence d'échantillonnage,
    les critères d'acceptation et le format du rapport sont convenus avant l'approbation de production.

    Le périmètre de contrôle et de documentation est confirmé selon le plan, les exigences qualité du client
    et la capacité réelle des équipements.
