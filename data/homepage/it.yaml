faq:
  heading: "Domande frequenti"
  items:
    - question: "Quali leghe di alluminio e magnesio colate?"
      answer: "Le leghe di alluminio e magnesio vengono esaminate in base a disegno, applicazione e disponibilità attuale dei materiali. Lega e stato finale vengono confermati per ciascuna RFQ."
    - question: "Qual è la tonnellatura massima della macchina di pressofusione?"
      answer: "La scelta della macchina viene confermata in base a dimensioni del componente, stampo, lega e peso di colata richiesto. Prima del lancio viene eseguita una verifica di fattibilità specifica."
    - question: "Effettuate lavorazione CNC e ispezione interne?"
      answer: "La lavorazione CNC successiva è disponibile internamente. Specifiche macchina, metodi ispettivi e fattibilità di ciascuna tolleranza vengono confermati per ogni progetto."
    - question: "Siete certificati secondo standard qualità automotive?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd. dispone del certificato IATF 16949:2016 T207408 / 0613009 per la produzione di parti pressofuse e lavorate, clausola 8.3 esclusa, e del certificato ISO 9001:2015 DZ/CN/2411010Q per parti meccaniche di precisione e stampi per pressofusione."
    - question: "Potete aiutare con la progettazione per la fabbricabilità (DFM)?"
      answer: "Il DFM può includere simulazioni di riempimento, solidificazione e raffreddamento quando pertinenti. Le decisioni su stampo e processo restano soggette a validazione specifica del componente."
    - question: "Qual è il tempo tipico di preventivo?"
      answer: "Per una RFQ ben definita esaminiamo disegno, ambito produttivo, requisiti ispettivi e rischi di progetto prima di confermare i tempi del preventivo."
    - question: "Supportate attrezzature ponte a basso volume?"
      answer: "Sì. Offriamo attrezzature ponte per prototipazione e convalida efficienti in piccoli lotti prima di impegnarsi in uno stampo di produzione completo."

rfq:
  heading: "Richiedi un preventivo"
  lead: "Invia disegni e requisiti per la revisione tecnica e la preparazione della RFQ."
  body: |
    Raccontaci il tuo materiale, spessore di parete, tolleranze, trattamento superficiale e volume
    annuo stimato. Il nostro team di ingegneria esaminerà il tuo progetto e risponderà con un piano
    di produzione pratico e ottimizzato dei costi.
