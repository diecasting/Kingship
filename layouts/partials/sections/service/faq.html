{{/*
  faq.html — FAQ accordion, native <details> (Phase 3B).
  Renders only when .Params.service.faq has >=1 item.
  Each item: { q: "...", a: "..." }
*/}}
{{ with .Params.service.faq }}
  {{ if gt (len .) 0 }}
    <section class="bg-neutral-50 py-12 dark:bg-neutral-900/40 sm:py-16">
      <div class="container mx-auto max-w-3xl px-4">
        <h2 class="text-2xl font-bold text-neutral-900 dark:text-neutral-100 sm:text-3xl">Frequently Asked Questions</h2>
        <div class="mt-8 space-y-3">
          {{ range . }}
            <details class="group rounded-xl border border-neutral-200 bg-white dark:border-neutral-700 dark:bg-neutral-800">
              <summary class="flex cursor-pointer list-none items-center justify-between px-5 py-4 font-semibold text-neutral-900 dark:text-neutral-100">
                <span>{{ .q }}</span>
                <span class="text-xl leading-none text-primary-500 transition group-open:rotate-45" aria-hidden="true">+</span>
              </summary>
              <div class="px-5 pb-4 text-neutral-600 dark:text-neutral-300">{{ .a }}</div>
            </details>
          {{ end }}
        </div>
      </div>
    </section>
  {{ end }}
{{ end }}
