faq:
  heading: "Preguntas frecuentes"
  items:
    - question: "¿Qué aleaciones de aluminio y magnesio moldea?"
      answer: "Las aleaciones de aluminio y magnesio se revisan según el plano, la aplicación y la disponibilidad actual del material. La aleación y el estado final se confirman para cada RFQ."
    - question: "¿Cuál es su tonelaje máximo de máquina?"
      answer: "La selección de máquina se confirma según el tamaño de la pieza, el diseño del molde, la aleación y el peso de disparo requerido. Se realiza una revisión de viabilidad específica antes del lanzamiento."
    - question: "¿Ofrecen mecanizado e inspección CNC internos?"
      answer: "El mecanizado CNC posterior está disponible internamente. Las especificaciones de máquina, los métodos de inspección y la viabilidad de cada tolerancia se confirman para cada proyecto."
    - question: "¿Están certificados según estándares de calidad automotriz?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd. cuenta con el certificado IATF 16949:2016 T207408 / 0613009 para la fabricación de piezas moldeadas y mecanizadas, con la cláusula 8.3 excluida, y con el certificado ISO 9001:2015 DZ/CN/2411010Q para piezas mecánicas de precisión y moldes de fundición."
    - question: "¿Ayudan con el diseño para fabricabilidad (DFM)?"
      answer: "El DFM puede incluir simulaciones de llenado, solidificación y refrigeración cuando encajan en el alcance. Las decisiones de utillaje y proceso siguen sujetas a validación específica de la pieza."
    - question: "¿Cuánto tarda una cotización?"
      answer: "Para una RFQ bien definida, revisamos el alcance de fabricación, los requisitos de inspección y los riesgos del proyecto antes de confirmar el plazo de cotización."
    - question: "¿Ofrecen utillaje puente para bajo volumen?"
      answer: "Sí. Ofrecemos utillaje puente para prototipos y validación de lotes pequeños antes de comprometer un utillaje de producción completo."

rfq:
  heading: "Solicitar cotización"
  lead: "Envíe planos y requisitos para la revisión técnica y la preparación de la RFQ."
  body: |
    Cuéntenos sobre su material, espesor de pared, tolerancias, tratamiento superficial y volumen anual
    estimado. Nuestro equipo de ingeniería revisará su proyecto y responderá con un plan de fabricación
    práctico y optimizado en costes.
