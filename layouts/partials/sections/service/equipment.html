{{/*
  equipment.html — Equipment & capacity list (Phase 3B).
  Renders only when .Params.service.equipment has >=1 item.
*/}}
{{ with .Params.service.equipment }}
  {{ if gt (len .) 0 }}
    <section class="py-12 sm:py-16">
      <div class="container mx-auto max-w-5xl px-4">
        <h2 class="text-2xl font-bold text-neutral-900 dark:text-neutral-100 sm:text-3xl">Equipment &amp; Capacity</h2>
        <ul class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
          {{ range . }}
            <li class="flex items-start gap-3 rounded-xl border border-neutral-200 bg-white p-5 dark:border-neutral-700 dark:bg-neutral-800">
              <svg class="mt-0.5 h-5 w-5 flex-none text-primary-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0L3.3 9.7a1 1 0 011.4-1.4l3.1 3.1 6.8-6.8a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>
              <span class="text-neutral-700 dark:text-neutral-200">{{ . }}</span>
            </li>
          {{ end }}
        </ul>
      </div>
    </section>
  {{ end }}
{{ end }}
