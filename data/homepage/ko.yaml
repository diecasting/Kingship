      alt: "대형 자동차 구조 부품을 생산하는 5000톤 다이캐스팅 머신"
      title: "5000T 대형 구조 주조"
    learn_more: ""

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "정밀 CNC 가공"
    heading: "정밀 CNC 가공"
    body: |
      주조는 이야기의 절반일 뿐입니다. KingShip의 사내 고정밀 CNC 가공장은 다이캐스팅 공정이 도달할 수
      없는 임계 결합 면을 드릴, 탭, 밀링, 보어링하여 부품을 완성합니다. 3축, 4축, 고속 5축 가공 센터는
      알루미늄 및 마그네슘 부품에 대해 ±0.01 mm의 공차를 유지합니다.

      가공이 주조 옆에 있기 때문에, 외주화로 인한 인도 지연과 품질 분쟁을 제거합니다. 기준점은 주조에서
      가공까지 일관되게 유지되고, 초도품 보고서는 동일한 현장에서 생성되며, 마지막 순간의 설계 변경은
      즉시 셀로 피드백됩니다. 또한 밀폐면을 위한 나선 탭, 보스 페이싱, 엄격한 공차 보어링과 같은 부가
      가치 작업을 수행합니다.

      압력 밀봉 부품의 경우       가공 직후 자동 누수 시험을 추가하여, 부품이 건물을 떠나기 전에 기밀성이
      확인됩니다. 최종 결과는 검사 준비가 완료된 마감 부품이 단일 공급업체로부터 인도된다는 것입니다.
