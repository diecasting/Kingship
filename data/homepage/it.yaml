  heading: "Controllo qualità e certificazioni"
  lead: "Pianificazione della qualità basata sui requisiti del disegno, sull'ambito ispettivo e su criteri di accettazione documentati."
  body: |
    Kingship (Dongguan) Precision Manufacturing Co., Ltd. dispone del certificato IATF 16949:2016
    T207408 / 0613009 per la produzione di parti pressofuse e lavorate, con la progettazione di
    prodotto secondo la clausola 8.3 esclusa. Il certificato ISO 9001:2015 DZ/CN/2411010Q copre
    parti meccaniche di precisione e stampi per pressofusione.

    I metodi ispettivi disponibili comprendono raggi X, CMM e prove di tenuta e pressione per i
    requisiti del progetto. Caratteristiche da ispezionare, frequenza di campionamento, criteri di
    accettazione e formato del rapporto vengono concordati prima dell'approvazione della produzione.

    Ambito ispettivo e documentale vengono confermati in base a disegno, requisiti qualità del cliente
    e capacità effettiva delle attrezzature.
