# --- Services (drives Service schema + homepage OfferCatalog) ---
# url_path must match the published section path (with or without language prefix).
services:
  - id: "aluminum-die-casting"
    name: "Aluminum Die Casting"
    url_path: "/aluminum-die-casting/"
    schema_type: "AluminumDieCasting"
    description: "High-pressure aluminum die casting in ADC12, A380 and A356 alloys with tight-tolerance dimensional control and in-house CNC finishing."
    languages:
      es:
        name: "Fundición a presión de aluminio"
        description: "Fundición a presión de aluminio de alta precisión en aleaciones ADC12, A380 y A356, con control dimensional de tolerancias ajustadas y acabado CNC interno."
      fr:
        name: "Moulage sous pression d'aluminium"
        description: "Moulage sous pression d'aluminium haute pression en alliages ADC12, A380 et A356, avec un contrôle dimensionnel à tolérances serrées et une finition CNC interne."
  - id: "magnesium-die-casting"
    name: "Magnesium Die Casting"
    url_path: "/magnesium-die-casting/"
    schema_type: "MagnesiumDieCasting"
    description: "Lightweight magnesium die casting in AZ91D and AM60B for automotive, EV and electronics enclosures."
    languages:
      es:
        name: "Fundición a presión de magnesio"
        description: "Fundición a presión de magnesio ligero en AZ91D y AM60B para carrocerías automotrices, vehículos eléctricos y carcasas electrónicas."
      fr:
        name: "Moulage sous pression de magnésium"
        description: "Moulage sous pression de magnésium léger en AZ91D et AM60B pour les carrosseries automobiles, véhicules électriques et boîtiers électroniques."
  - id: "semi-solid-rheocasting"
    name: "Semi Solid Rheocasting"
    url_path: "/semi-solid-rheocasting/"
    schema_type: "Rheocasting"
    description: "Semi-solid rheocasting for low-porosity, high-integrity structural components."
    languages:
      es:
        name: "Reofundición semi-sólida"
        description: "Reofundición semi-sólida para componentes estructurales de baja porosidad y alta integridad."
      fr:
        name: "Rhéocoulée semi-solide"
        description: "Rhéocoulée semi-solide pour des composants structurels à faible porosité et haute intégrité."
  - id: "cnc-machining"
    name: "CNC Machining"
    url_path: "/cnc-machining/"
    schema_type: "CncMachining"
    description: "Precision 3/4/5-axis CNC machining and post-processing for cast components."
    languages:
      es:
        name: "Mecanizado CNC"
        description: "Mecanizado CNC de precisión de 3, 4 y 5 ejes y posprocesado para componentes fundidos."
      fr:
        name: "Usinage CNC"
        description: "Usinage CNC de précision 3/4/5 axes et post-traitement pour les composants moulés."
  - id: "die-casting-tooling"
    name: "Die Casting Tooling"
    url_path: "/tooling/"
    schema_type: "Tooling"
    description: "In-house die casting tooling design, manufacturing and maintenance."
    languages:
      es:
        name: "Utillaje de fundición a presión"
        description: "Diseño, fabricación y mantenimiento de utillaje de fundición a presión en instalaciones propias."
      fr:
        name: "Outillage de moulage sous pression"
        description: "Conception, fabrication et maintenance d'outillage de moulage sous pression en interne."

