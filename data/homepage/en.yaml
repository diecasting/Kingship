capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Aluminum Die Casting"
    heading: "Aluminum Die Casting"
    body: |
      Aluminum high-pressure die casting is the backbone of our production. We cast a wide range
      of structural and functional components in ADC12, A380, A356 and A360 alloys, balancing
      thermal conductivity, corrosion resistance and dimensional stability for demanding service
      environments. Our cold-chamber machines span 400T to 5000T, allowing us to serve everything
      from intricate thin-wall enclosures to large automotive structural parts in a single shot.

      Every aluminum die casting program begins with mold-flow simulation. By modeling filling,
      solidification and cooling before tooling is built, we remove cold shuts, misruns and
      shrinkage porosity at the design stage rather than on the production line. Post-casting,
      in-house CNC machining centers hold critical mating surfaces to ±0.01 mm, and secondary
      operations such as anodizing, powder coating, shot blasting and impregnation are coordinated
      within the same facility.

      Typical applications include automotive powertrain housings, EV battery trays and brackets,
      heat sinks, lighting housings and electronic enclosures. For customers who need verified
      material behavior, we publish engineering references on ADC12 properties and A356 structural
      integrity so design teams can specify with confidence.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "High-Pressure Die Casting"
      - "CNC Machining"
      - "Anodizing & Powder Coating"
      - "Impregnation"
    equipment:
      - "400T–5000T Cold Chamber Machines"
      - "5-Axis CNC Machining Centers"
    applications:
      - "Automotive powertrain"
      - "EV battery housings"
      - "Heat sinks & enclosures"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/A356-aluminum-die-casting-porosity-control.webp"
      alt: "A356 aluminum die casting component under porosity control inspection"
      title: "A356 Aluminum Die Casting"
    learn_more: "/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Magnesium Die Casting"
    heading: "Magnesium Die Casting"
    body: |
      Magnesium die casting delivers the ultimate weight reduction — roughly one-third lighter
      than aluminum at comparable stiffness — making it the material of choice for weight-critical
      automotive, aerospace and premium electronics components. KingShip casts AZ91D and AM60B
      magnesium alloys on dedicated hot- and cold-chamber machines, with minimum wall thickness
      down to 1.0 mm for thin-wall, complex geometries.

      Magnesium's high strength-to-weight ratio and excellent EMI/RFI shielding are valuable for
      electric-vehicle brackets, sensor housings, drone frames and handheld devices. We protect
      surface integrity with passivation and electroplating processes tuned for magnesium
      corrosion resistance, and we verify wall thickness and internal quality with real-time
      X-ray inspection before shipment.

      Because magnesium casting demands strict process control, our engineers manage melt
      protection, injection velocity and die temperature closely to avoid oxidation and hot
      cracking. The outcome is a lightweight, dimensionally stable component that helps OEMs hit
      aggressive vehicle-mass and range targets without sacrificing structural performance.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "High-Pressure Magnesium Die Casting"
      - "Passivation"
      - "Electroplating"
    equipment:
      - "160T–2250T Magnesium Die Casting Machines"
      - "Real-Time X-Ray Inspection"
    applications:
      - "Automotive brackets"
      - "Aerospace components"
      - "Premium handheld devices"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/lightweight-magnesium-die-casting-3c-aerospace-parts.webp"
      alt: "Lightweight magnesium die cast aerospace and 3C electronic parts"
      title: "Magnesium Die Casting Parts"
    learn_more: "/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Semi-Solid Rheocasting"
    heading: "Semi-Solid Rheocasting"
    body: |
      Semi-solid rheocasting is our solution for parts that must combine low porosity, high
      ductility and heat-treatability. By forming the alloy in its semi-solid state — a slurry of
      solid globules suspended in liquid — rheocasting almost eliminates gas entrapment and
      shrinkage porosity that conventional high-pressure die casting cannot fully avoid.

      The result is a casting that can be T5 or T6 heat treated, welded and mechanically worked,
      opening the door to structural safety components where flaw-free integrity is non-negotiable.
      KingShip operates a Yizumi semi-solid rheocasting system and validates microstructural
      uniformity with metallography and real-time X-ray comparison, so customers can qualify
      rheocast parts for crash-relevant and load-bearing applications.

      Rheocasting is especially attractive for EV and aerospace structural nodes, suspension
      brackets and booms where fatigue life matters. By reducing porosity at the source, we shrink
      the inspection burden downstream and improve the predictability of every shipped lot.
    materials:
      - "A356 Rheocast"
      - "Custom Aluminum Slurries"
    processes:
      - "Semi-Solid Rheocasting"
      - "T5 / T6 Heat Treatment"
      - "Metallographic Validation"
    equipment:
      - "Yizumi Semi-Solid Rheocasting System"
      - "X-Ray Porosity Testing"
    applications:
      - "EV structural nodes"
      - "Aerospace brackets"
      - "Fatigue-critical components"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/semi-solid-casting-microstructure-vs-xray-porosity-test.webp"
      alt: "Semi-solid rheocast microstructure compared with X-ray porosity testing"
      title: "Semi-Solid Rheocasting Microstructure"

  - id: "5000t-structural-casting"
    anchor: "capability-5000t"
    name: "5000T Large Structural Casting"
    heading: "5000T Large Structural Casting"
    body: |
      Our 5000-ton cold-chamber die casting machine is built for the largest, thinnest-wall
      structural components in the automotive and EV industries. Large structural castings — such
      as battery tray side rails, shock towers, tunnel housings and crossmembers — consolidate
      what used to be dozens of stamped and welded stampings into a single, stiff, lightweight
      aluminum part.

      Producing these parts demands more than tonnage. It requires precise shot control, thermal
      management of a very large die, and disciplined process windows to keep warpage and porosity
      in check across a meter-scale footprint. KingShip's engineering team models the entire
      casting system, then validates first articles with CMM, X-ray and leak testing before ramp.

      By integrating large structural casting with in-house CNC machining and finishing, we deliver
      a dimensionally complete assembly-ready component, not just a raw casting. This reduces
      customer inbound logistics, welding distortion risk and total program cost while improving
      vehicle stiffness and crash performance.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "5000T High-Pressure Die Casting"
      - "Large-Die Thermal Management"
      - "Assembly-Ready CNC Finishing"
    equipment:
      - "5000T Cold Chamber Die Casting Machine"
      - "Large-Format CMM"
    applications:
      - "EV battery structures"
      - "Shock towers & crossmembers"
      - "Structural nodes"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2022/10/5000t-aluminum-die-casting-machine-large-structural-parts.webp"
      alt: "5000-ton die casting machine producing large automotive structural components"
      title: "5000T Large Structural Casting"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Precision CNC Machining"
    heading: "Precision CNC Machining"
    body: |
      Casting is only half the story. KingShip's in-house high-precision CNC workshop completes the
      component — drilling, threading, milling and boring the critical mating surfaces that the
      die casting process cannot reach. Our 3-axis, 4-axis and high-speed 5-axis machining centers
      hold tolerances up to ±0.01 mm on aluminum and magnesium parts.

      Because machining sits next to casting, we eliminate the hand-off delays and quality disputes
      that come with outsourcing. Datums are consistent from cast to cut, first-article reports are
      generated on the same floor, and last-minute design tweaks flow straight back to the cell.
      We also perform value-added operations such as helical threading, boss facing and tight-tolerance
      bores for sealing surfaces.

      For pressure-sealed components we add automated leak testing immediately after machining, so
      airtightness is confirmed before the part leaves the building. The net effect is a finished,
      inspection-ready component delivered from a single supplier.
    materials:
      - "Aluminum Alloys"
      - "Magnesium Alloys"
    processes:
      - "3 / 4 / 5-Axis CNC Machining"
      - "Precision Drilling & Threading"
      - "Automated Leak Testing"
    equipment:
      - "High-Speed 5-Axis CNC Centers"
      - "Automated Leak Testing Equipment"
    applications:
      - "Sealing surfaces"
      - "Critical mating features"
      - "Finished components"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/precision-multi-axis-cnc-machining-tight-tolerance-parts.webp"
      alt: "Precision multi-axis CNC machining of tight-tolerance die cast parts"
      title: "Precision CNC Machining"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Die Casting Tooling"
    heading: "Die Casting Tooling"
    body: |
      Tooling quality defines everything that follows. KingShip operates an in-house tooling shop
      using advanced CAD/CAM, Pro/E, UG and Moldflow simulation to design and build dies that run
      longer and produce cleaner parts. Optimized gating and cooling systems reduce cycle time,
      minimize porosity and extend mold life beyond 100,000 shots.

      Keeping tooling under our own roof means faster iteration: engineering changes, maintenance
      and refurbishment happen without third-party lead times. It also lets us protect proprietary
      gating know-how and keep it consistent across a product family. For low-volume bridge programs
      we offer bridge tooling that gets prototypes into your hands quickly before committing to a
      full production die.

      A well-engineered die is the cheapest insurance against scrap, downtime and field failures.
      That is why KingShip treats tooling as a core competency, not a purchased commodity.
    materials:
