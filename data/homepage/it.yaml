faq:
  heading: "Domande frequenti"
  items:
    - question: "Quali leghe di alluminio e magnesio colate?"
      answer: "Coliamo leghe di alluminio ADC12, A380, A356 e A360, oltre a leghe di magnesio AZ91D e AM60B. Sono disponibili su richiesta slurry rheocast e composizioni personalizzate."
    - question: "Qual è la tonnellatura massima della macchina di pressofusione?"
      answer: "La nostra macchina più grande è una pressa di pressofusione ad alta pressione a camera fredda da 5000 tonnellate, in grado di produrre componenti strutturali a parete sottile di scala metrica per piattaforme automotive ed EV."
    - question: "Effettuate lavorazione CNC e ispezione interne?"
      answer: "Sì. Operiamo centri di lavorazione CNC a 3, 4 e 5 assi e eseguiamo internamente verifica dimensionale CMM, ispezione porosità a raggi X in tempo reale e test di perdita automatizzato."
    - question: "Siete certificati secondo standard qualità automotive?"
      answer: "KingShip è certificata ISO 9001 e IATF 16949, e il nostro sistema di gestione qualità è costruito per requisiti automotive, aerospaziali e di grado medicale."
    - question: "Potete aiutare con la progettazione per la fabbricabilità (DFM)?"
      answer: "Assolutamente. Eseguiamo simulazioni Magma e Moldflow durante la fase di progettazione per eliminare porosità e ritiri a freddo prima dell'attrezzatura, accorciando i tempi di sviluppo e riducendo il costo per pezzo."
    - question: "Qual è il tempo tipico di preventivo?"
      answer: "Per un RFQ ben definito con disegni e requisiti, restituiamo tipicamente una revisione ingegneristica completa e un preventivo formale entro 24 ore."
    - question: "Supportate attrezzature ponte a basso volume?"
      answer: "Sì. Offriamo attrezzature ponte per prototipazione e convalida efficienti in piccoli lotti prima di impegnarsi in uno stampo di produzione completo."

