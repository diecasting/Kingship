faq:
  heading: "자주 묻는 질문"
  items:
    - question: "어떤 알루미늄 및 마그네슘 합금을 주조하나요?"
      answer: "당사는 알루미늄 합금 ADC12, A380, A356, A360과 마그네슘 합금 AZ91D, AM60B를 주조합니다. 레오캐스트 슬러리와 맞춤 조성도 요청 시 가능합니다."
    - question: "최대 다이캐스팅 머신 토네이지는 얼마인가요?"
      answer: "당사의 가장 큰 머신은 5000톤 콜드 챔버 고압 다이캐스팅 머신으로, 자동차 및 EV 플랫폼용 미터 스케일 박벽 구조 부품을 생산할 수 있습니다."
    - question: "사내 CNC 가공 및 검사를 제공하나요?"
      answer: "예. 당사는 3, 4, 5축 CNC 가공 센터를 운영하며 사내에서 CMM 치수 검증, 실시간 X선 기공 검사, 자동 누수 시험을 수행합니다."
    - question: "자동차 품질 표준 인증을 받았나요?"
      answer: "KingShip은 ISO 9001 및 IATF 16949 인증을 받았으며, 당사의 품질 경영 시스템은 자동차, 항공우주, 의료 등급 요구사항을 위해 구축되었습니다."
    - question: "제조 가능성 설계(DFM)를 지원하나요?"
      answer: "물론입니다. 당사는 설계 단계에서 Magma 및 Moldflow 시뮬레이션을 실행하여 금형 가공 전에 기공과 콜드 셧을 제거하여 개발 시간을 단축하고 부품당 비용을 낮춥니다."
    - question: "일반적인 견적 소요 시간은 얼마인가요?"
      answer: "도면과 요구사항이 명확한 RFQ의 경우 일반적으로 24시간 이내에 포괄적인 엔지니어링 검토와 공식 견적을 제공합니다."
    - question: "저량 브리지 금형을 지원하나요?"
      answer: "예. 당사는 전체 생산 금형에 투자하기 전에 효율적인 소량 프로토타입 및 검증을 위한 브리지 금형을 제공합니다."

rfq:
  heading: "견적 요청"
  lead: "도면과 요구사항을 보내주시면 24시간 이내에 엔지니어링 검토와 공식 견적을 받으실 수 있습니다."
  body: |
    재료, 벽두께, 공차, 표면 처리, 연간 예상 물량을 알려주세요. 당사 엔지니어링 팀이 프로젝트를
    검토하고 실용적이고 비용 최적화된 제조 계획으로 회신합니다.
