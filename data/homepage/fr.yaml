faq:
  heading: "Questions fréquentes"
  items:
    - question: "Quels alliages d'aluminium et magnésium coulez-vous ?"
      answer: "Nous coulons les alliages d'aluminium ADC12, A380, A356 et A360, ainsi que les alliages de magnésium AZ91D et AM60B. Barbotines rheocast et compositions personnalisées disponibles sur demande."
    - question: "Quelle est votre force de serrage maximale ?"
      answer: "Notre plus grande machine est une presse de moulage sous pression en chambre froide de 5000 tonnes, capable de produire des pièces structurelles à paroi mince à l'échelle métrique."
    - question: "Proposez-vous usinage et inspection CNC internes ?"
      answer: "Oui. Nous exploitons des centres CNC 3, 4 et 5 axes, ainsi que vérification MMT, inspection de porosité rayons X temps réel et tests d'étanchéité automatisés."
    - question: "Êtes-vous certifiés selon les normes automobiles ?"
      answer: "KingShip est certifié ISO 9001 et IATF 16949, avec un système qualité orienté automobile, aéronautique et médical."
    - question: "Aidez-vous au DFM (conception pour la fabricabilité) ?"
      answer: "Bien sûr. Nous réalisons la simulation Magma et Moldflow en phase conception pour éliminer porosité et coulées à froid avant l'outillage."
    - question: "Quel est le délai de devis ?"
      answer: "Pour un RFQ clair avec plans et exigences, nous renvoyons généralement une revue d'ingénierie et un devis formel sous 24 heures."
    - question: "Proposez-vous l'outillage pont pour faible volume ?"
      answer: "Oui. Nous proposons l'outillage pont pour prototypes et validation de petits lots avant de s'engager dans un outillage de production complet."

rfq:
  heading: "Demander un devis"
  lead: "Envoyez vos plans et exigences — recevez une revue d'ingénierie et un devis formel sous 24 heures."
  body: |
    Indiquez-nous votre matériau, épaisseur de paroi, tolérances, traitement de surface et volume annuel
    estimé. Notre équipe d'ingénierie examinera votre projet et répondra avec un plan de fabrication
    pratique et optimisé en coûts.
