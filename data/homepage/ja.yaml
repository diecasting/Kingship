faq:
  heading: "よくある質問"
  items:
    - question: "どのアルミ・マグネシウム合金を鋳造しますか？"
      answer: "アルミニウム・マグネシウムの鋳造合金は、図面、用途、現在の材料供給状況に基づいて確認します。最終合金と状態は各RFQで確定します。"
    - question: "最大のマシントン数は？"
      answer: "設備選定は、部品サイズ、金型設計、合金、必要なショット重量に基づいて確定します。量産開始前に案件別のフィージビリティレビューを行います。"
    - question: "社内CNC加工と検査に対応していますか？"
      answer: "CNC後加工は社内で対応します。設備仕様、検査方法、各公差の実現性は案件ごとに確認します。"
    - question: "自動車品質基準の認証を取得していますか？"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd.は、ダイカスト品・機械加工品の製造についてIATF 16949:2016認証 T207408 / 0613009（箇条8.3除外）を、精密機械部品・ダイカスト金型についてISO 9001:2015認証 DZ/CN/2411010Qを保有しています。"
    - question: "DFM（製造性設計）に対応していますか？"
      answer: "DFMでは、案件範囲に適する場合、充填・凝固・冷却シミュレーションを含められます。金型・工程の決定は部品ごとの検証を前提とします。"
    - question: "見積もりのリードタイムは？"
      answer: "要件が明確なRFQでは、製造範囲、検査要件、プロジェクトリスクを確認したうえで見積回答時期をご案内します。"
    - question: "小ロット向けブリッジ金型に対応していますか？"
      answer: "はい。本格量産金型に踏み切る前の小ロット試作・検証向けにブリッジ金型を提供します。"

rfq:
  heading: "見積もりを依頼"
  lead: "図面と要件をお送りください。技術レビューとRFQ検討を進めます。"
  body: |
    材料、肉厚、公差、表面処理、想定年間数量をお知らせください。当社エンジニアリングチームがプロジェクトを
    検討し、実践的でコスト最適化された製造計画で回答します。
