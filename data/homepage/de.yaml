capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Aluminium-Druckguss"
    heading: "Aluminium-Druckguss"
    body: |
      Der Hochdruck-Aluminiumdruckguss ist das Rückgrat unserer Fertigung. Wir gießen eine breite
      Palette struktureller und funktionaler Bauteile in den Legierungen ADC12, A380, A356 und A360
      und balancieren Wärmeleitfähigkeit, Korrosionsbeständigkeit und Formstabilität für anspruchsvolle
      Einsatzumgebungen. Unsere Kaltkammer-Maschinen decken 400T bis 5000T ab – von filigranen
      Dünnwandgehäusen bis zu großen Automobilstrukturbauteilen in einem Schuss.

      Jedes Aluminium-Druckgussprogramm beginnt mit einer Formfüllsimulation. Durch die Modellierung
      von Füllung, Erstarrung und Abkühlung vor dem Werkzeugbau entfernen wir kalte Läufe,
      Lufteinschlüsse und Schrumpfporosität bereits in der Designphase. Nach dem Guss halten die
      internen CNC-Bearbeitungszentren kritische Passflächen auf ±0,01 mm; Sekundärprozesse wie
      Eloxieren, Pulverbeschichten, Kugelstrahlen und Impregnieren laufen in derselben Anlage.

      Typische Anwendungen sind Antriebsgehäuse, EV-Batterieträger und -halterungen, Kühlkörper,
      Leuchtengehäuse und Elektronikgehäuse.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Hochdruck-Druckguss"
      - "CNC-Bearbeitung"
      - "Eloxieren & Pulverbeschichten"
      - "Impregnieren"
    equipment:
      - "Kaltkammer-Maschinen 400T–5000T"
      - "5-Achs-CNC-Bearbeitungszentren"
    applications:
      - "Antriebsstrang"
      - "EV-Batteriegehäuse"
      - "Kühlkörper & Gehäuse"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/A356-aluminum-die-casting-porosity-control.webp"
      alt: "A356-Aluminiumdruckguss-Bauteil unter Porositätskontrolle"
      title: "A356-Aluminiumdruckguss"
    learn_more: "/de/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Magnesium-Druckguss"
    heading: "Magnesium-Druckguss"
    body: |
      Magnesium-Druckguss bietet die maximale Gewichtsreduzierung – etwa ein Drittel leichter als
      Aluminium bei vergleichbarer Steifigkeit – und ist daher das Material der Wahl für
      gewichtskritische Automobil-, Luftfahrt- und Premium-Elektronikbauteile. KingShip gießt die
      Magnesiumlegierungen AZ91D und AM60B auf dedizierten Maschinen, mit Mindestwandstärken bis
      1,0 mm für dünnwandige, komplexe Geometrien.

      Die hohe Festigkeit bei geringem Gewicht und die exzellente EMI/RFI-Abschirmung von Magnesium
      sind wertvoll für EV-Halterungen, Sensorgehäuse, Drohnenrahmen und Handgeräte. Wir schützen die
      Oberfläche mit Passivierung und Galvanisierung, die auf Magnesiumkorrosionsbeständigkeit
      abgestimmt sind, und verifizieren Wandstärke und Innere Qualität per Echtzeit-Röntgenprüfung.

      Da Magnesiumguss strikte Prozesskontrolle erfordert, steuern unsere Ingenieure Schmelzschutz,
      Einspritzgeschwindigkeit und Werkzeugtemperatur eng, um Oxidation und Heißriss zu vermeiden.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Hochdruck-Magnesium-Druckguss"
      - "Passivierung"
      - "Galvanisieren"
    equipment:
      - "Magnesium-Druckgussmaschinen 160T–2250T"
      - "Echtzeit-Röntgenprüfung"
    applications:
      - "Automobilhalterungen"
      - "Luftfahrtbauteile"
      - "Premium-Handgeräte"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/03/lightweight-magnesium-die-casting-3c-aerospace-parts.webp"
      alt: "Leichte Magnesium-Druckguss-Luftfahrt- und 3C-Elektronikteile"
      title: "Magnesium-Druckguss"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Semi-Solid-Rheocasting"
    heading: "Semi-Solid-Rheocasting"
    body: |
      Semi-Solid-Rheocasting ist unsere Lösung für Bauteile, die niedrige Porosität, hohe Duktilität
      und Wärmebehandelbarkeit kombinieren müssen. Durch die Umformung der Legierung im teilerstarrten
      Zustand – ein Brei aus festen Globularen in Flüssigkeit – vermeidet Rheocasting Gaseinschlüsse
      und Schrumpfporosität, die der konventionelle Hochdruck-Druckguss nicht vollständig verhindern kann.

      Das Ergebnis ist ein Guss, der T5- oder T6-wärmebehandelt, geschweißt und mechanisch bearbeitet
      werden kann – ideal für strukturelle Sicherheitsbauteile mit makelloser Integrität. KingShip
      betreibt ein Yizumi-Rheocasting-System und validiert die Gefügegleichmäßigkeit metallografisch
      sowie im Echtzeit-Röntgenvergleich.

      Rheocasting ist besonders attraktiv für EV- und Luftfahrt-Strukturknoten, Fahrwerkshalterungen
      und Ausleger, bei denen die Ermüdungsfestigkeit entscheidet.
    materials:
      - "A356 Rheocast"
      - "Kundenspezifische Aluminium-Breie"
    processes:
      - "Semi-Solid-Rheocasting"
      - "T5 / T6 Wärmebehandlung"
      - "Metallografische Validierung"
    equipment:
      - "Yizumi Semi-Solid-Rheocasting-System"
      - "Röntgen-Porositätsprüfung"
    applications:
      - "EV-Strukturknoten"
      - "Luftfahrt-Halterungen"
      - "Ermüdungskritische Bauteile"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2026/06/semi-solid-casting-microstructure-vs-xray-porosity-test.webp"
      alt: "Semi-Solid-Rheoguss-Gefüge im Vergleich mit Röntgen-Porositätsprüfung"
      title: "Semi-Solid-Rheocasting-Gefüge"

  - id: "5000t-structural-casting"
    anchor: "capability-5000t"
    name: "5000T-Strukturguss"
    heading: "5000T-Strukturguss"
    body: |
      Unsere 5000-Tonnen-Kaltkammer-Druckgussmaschine ist für die größten, dünnwandigsten
      Strukturbauteile der Automobil- und EV-Industrie gebaut. Große Strukturgüsse – wie
      Batterieträger-Seitenprofile, Domlager, Tunnelgehäuse und Querträger – fassen das zusammen, was
      früher Dutzende Blech- und Schweißteile waren, in ein einziges, steifes, leichtes Aluminiumteil.

      Die Fertigung dieser Teile verlangt mehr als nur Tonnen. Sie erfordert präzise Schusskontrolle,
      Wärmemanagement eines sehr großen Werkzeugs und disziplinierte Prozessfenster, um Verzug und
      Porosität über eine meter große Fläche zu beherrschen. KingShip modelliert das gesamte
      Gießsystem und validiert Erstmuster mit CMM, Röntgen und Lecktest vor der Hochlaufphase.

      Durch die Integration von Großstrukturguss mit interner CNC-Bearbeitung liefern wir ein
      maßhaltiges, montagefertiges Bauteil – nicht nur einen Rohguss.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "5000T-Hochdruck-Druckguss"
      - "Großwerkzeug-Wärmemanagement"
      - "Montagefertige CNC-Bearbeitung"
    equipment:
      - "5000T-Kaltkammer-Druckgussmaschine"
      - "Großformat-CMM"
    applications:
      - "EV-Batteriestrukturen"
      - "Domlager & Querträger"
      - "Strukturknoten"
    image:
      url: "https://alumcasting.com/wp-content/uploads/2022/10/5000t-aluminum-die-casting-machine-large-structural-parts.webp"
      alt: "5000-Tonnen-Gussmaschine für große Automobilstrukturbauteile"
      title: "5000T-Strukturguss"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Präzise CNC-Bearbeitung"
    heading: "Präzise CNC-Bearbeitung"
    body: |
      Guss ist nur die halbe Geschichte. Kingships internes CNC-Bearbeitungszentrum vervollständigt
      das Bauteil – Bohren, Gewinden, Fräsen und Reiben der kritischen Passflächen, die der
      Druckgussprozess nicht erreicht. Unsere 3-, 4- und 5-Achs-Hochgeschwindigkeitszentren halten
      Toleranzen bis ±0,01 mm an Aluminium- und Magnesiumteilen.

      Da die Bearbeitung direkt neben dem Guss steht, entfallen Übergabe-Verzögerungen und
      Qualitätsstreitigkeiten des Outsourcings. Bezüge sind vom Guss bis zum Schnitt konsistent,
      Erstmesser werden auf demselben Boden erzeugt, und letzte Konstruktionsänderungen fließen
      sofort zurück in die Zelle.

      Für druckgedichtete Bauteile fügen wir automatische Lecktests direkt nach der Bearbeitung hinzu,
      sodass die Dichtheit bestätigt ist, bevor das Teil das Haus verlässt.
    materials:
      - "Aluminiumlegierungen"
      - "Magnesiumlegierungen"
    processes:
      - "3 / 4 / 5-Achs-CNC-Bearbeitung"
      - "Präzises Bohren & Gewinden"
      - "Automatisierter Lecktest"
    equipment:
      - "Hochgeschwindigkeits-5-Achs-CNC-Zentren"
      - "Automatische Lecktestanlage"
    applications:
      - "Dichtflächen"
      - "Kritische Passfeatures"
      - "Fertigbauteile"
    image:
