intro:
  heading: "Who We Are"
  lead: "A vertically integrated B2B die casting manufacturer delivering reliability from molten metal to finished component."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. is a dedicated B2B supplier of
    high-pressure aluminum and magnesium alloy die casting, in-house CNC post-processing,
    die-casting process evaluation and tooling engineering. The company supports automotive,
    electric-vehicle, industrial and other manufacturing programs with project-specific
    engineering and production planning.

    KingShip coordinates die-casting, CNC post-machining and metrology from its Dongguan
    manufacturing base. The applicable production route and external-process scope are
    confirmed for each project. Inspection methods, sampling and documentation are agreed
    against the drawing and customer requirements.

    Our engineering team collaborates with customers from the first DFM review, using fill and
    solidification simulation where appropriate to assess cold shuts, air entrapment and
    shrinkage porosity before the first tool is cut. Whether the project involves a housing, bracket, machined
    casting or large structural component, the process route and inspection scope are
    confirmed from the drawing, volume and quality requirements.

