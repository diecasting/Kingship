intro:
  heading: "Who We Are"
  lead: "A vertically integrated B2B die casting manufacturer delivering reliability from molten metal to finished component."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. is a dedicated B2B supplier of
    high-pressure aluminum and magnesium alloy die casting, in-house CNC post-processing,
    semi-solid rheocasting and professional tooling engineering. For more than two decades we
    have helped automotive, electric-vehicle, aerospace, medical and industrial customers turn
    demanding geometries into repeatable, high-integrity production parts.

    We are not a trading company. Every casting is produced inside our own Dongguan facility,
    where modern cold-chamber die casting cells are integrated with fully automated robotic
    extraction, real-time X-ray porosity detection and a high-precision CNC machining center.
    This vertical integration lets us control dimensional accuracy, surface quality and lead
    time across the entire process — design, simulation, casting, machining, finishing and
    inspection — under a single quality management system certified to ISO 9001 and IATF 16949.

    Our engineering team collaborates with customers from the first DFM review, using Magma
    and Moldflow simulation to eliminate cold shuts, air entrapment and shrinkage porosity
    before the first tool is cut. The result is a shorter development cycle, lower piece cost
    and structural components that pass qualification on the first try. Whether you need a
    lightweight magnesium bracket, a heat-treatable semi-solid rheocast part, or a 5000T large
    structural casting for an EV battery platform, KingShip is built to be your long-term
    manufacturing partner.

