      title: "Aluminium-Strukturguss"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "Große Strukturgüsse"
    heading: "Große Strukturgüsse"
    body: |
      Große Strukturgüsse können mehrere gestanzte oder geschweißte Bauteile in einem leichten Bauteil
      zusammenführen. Zu den Beispielen zählen Batterieträger-Seitenprofile, Domlager, Tunnelgehäuse und
      Querträger.

      Solche Teile erfordern präzise Schusskontrolle, Wärmemanagement einer großen Form und disziplinierte
      Prozessfenster zur Steuerung von Verzug und Porosität. Die technische Prüfung berücksichtigt vor der
      Machbarkeitsbestätigung Maschinen- und Formengröße, Schussgewicht, Legierung und Prüfplan.

      Der Prozessplan kann CNC-Nachbearbeitung und Veredelung umfassen; Bearbeitungsroute und Prüfumfang
      werden anhand der Fertigungszeichnung vereinbart.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
