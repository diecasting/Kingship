quality:
  heading: "품질 관리 및 인증"
  lead: "국제 인증과 비파괴 검사를 갖춘 제로 결함 마인드."
  body: |
    KingShip은 자동차, 항공우주, 의료 등급 기대치를 위해 구축된 포괄적인 품질 경영 시스템을 운영합니다.
    당사 시설은 IATF 16949 및 ISO 9001 인증을 받았으며, 모든 고압 다이캐스팅 작업은 문서화된 공정 제어,
    통계적 모니터링, 지속적 개선에 의해 관리됩니다.

    구조 무결성은 가정하는 것이 아니라 검증됩니다. 실시간 X선 검출 시스템은 표면 검사가 놓치는 내부
    기공, 균열, 개재물을 드러내는 비파괴 검사를 수행합니다. 좌표 측정기(CMM)는 CAD 모델 대비 치수
    정확도를 확인하고, 자동 누수 시험은 압력 밀봉 부품의 기밀성과 유체 취급 성능을 검증합니다. SureTech
    650 표면 처리와 같은 마감 단계가 다운스트림 공정을 완성합니다.

      이러한 계층화된 검사 전략은 고객이 조립 라인이 아니라 선적 전에 자격을 갖춘 부품을 받는다는
      것을 의미하며, 귀사의 라인, 일정, 브랜드를 보호합니다.
  standards:
