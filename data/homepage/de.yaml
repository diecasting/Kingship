intro:
  heading: "Wer wir sind"
  lead: "Ein vertikal integrierter B2B-Druckgusshersteller mit projektbezogener Fertigungs- und Prüfplanung."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. ist ein spezialisierter B2B-Lieferant für
    Hochdruck-Druckguss aus Aluminium- und Magnesiumlegierungen, interne CNC-Nachbearbeitung,
    Druckguss-Prozessprüfung und Werkzeugtechnik. Das Unternehmen unterstützt Programme in den Bereichen
    Automobilbau, Elektrofahrzeuge, Industrie und weiteren Fertigungsanwendungen durch projektbezogene
    Engineering- und Produktionsplanung.

    KingShip koordiniert Druckguss, CNC-Nachbearbeitung und Messtechnik von seinem
    Fertigungsstandort in Dongguan aus. Die anwendbare Produktionsroute und der Umfang
    externer Prozesse werden für jedes Projekt bestätigt. Prüfmethoden, Stichprobenumfang
    und Dokumentation werden anhand der Zeichnung und der Kundenanforderungen vereinbart.

    Unser Engineering-Team arbeitet ab der ersten DFM-Besprechung mit den Kunden und setzt Füll- und
    Erstarrungssimulationen ein, sofern sie zum Projektumfang passen. Vor der Freigabe werden Prozessroute
    und Prüfumfang anhand von Zeichnung, Stückzahl und Qualitätsanforderungen festgelegt.

