      - "피로 임계 부품"
    image:
      url: "https://alumcasting.com/images/semi-solid-casting-microstructure-vs-xray-porosity-test.webp"
      alt: "반용융 레오캐스트 미세 조직과 X선 기공 시험 비교"
      title: "반용융 레오캐스트 미세 조직"
    learn_more: "/semi-solid-rheocasting/"

  - id: "5000t-structural-casting"
    anchor: "capability-5000t"
    name: "5000T 대형 구조 주조"
    heading: "5000T 대형 구조 주조"
    body: |
      당사의 5000톤 콜드 챔버 다이캐스팅 머신은 자동차 및 EV 산업의 가장 크고 박벽인 구조 부품을 위해
      만들어졌습니다. 배터리 트레이 사이드 레일, 쇼크 타워, 터널 하우징, 크로스멤버와 같은 대형 구조
      주조물은 과거 수십 개의 스탬핑 및 용접 부품을 단일의 강성 있는 경량 알루미늄 부품으로 통합합니다.

      이러한 부품을 생산하려면 토네이지만으로는 부족합니다. 미터 스케일의 대형 금형에 대한 정밀한
      샷 제어, 열 관리, 그리고 변형과 기공을 억제하는 규율 있는 공정 창이 필요합니다. KingShip의
      엔지니어링 팀은 주조 시스템 전체를 모델링한 다음, 램프 전 CMM, X선, 누수 시험으로 초도품을
      검증합니다.

      대형 구조 주조를 사내 CNC 가공 및 마감과 통합함으로써, 당사는 조립 준비가 완료된 치수 완전한
      부품을 제공하며 단순한 주조 블랭크만 제공하는 것이 아닙니다. 이는 고객의 인바운드 물류, 용접
      변형 위험, 총 프로그램 비용을 줄이고 차량 강성과 충돌 성능을 개선합니다.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "5000T 고압 다이캐스팅"
      - "대형 금형 열 관리"
      - "조립 준비 CNC 마감"
    equipment:
      - "5000T 콜드 챔버 다이캐스팅 머신"
      - "대형 포맷 CMM"
    applications:
