intro:
  heading: "회사 소개"
  lead: "용융 금속부터 완제품까지 신뢰성을 보장하는 수직 계열화된 B2B 다이캐스팅 제조업체."
  body: |
    KingShip(동관) 정밀 제조 유한회사는 고압 알루미늄 및 마그네슘 합금 다이캐스팅, 사내 CNC 후가공,
    반용융 레오캐스팅, 전문 금형 엔지니어링을 전문으로 하는 B2B 공급업체입니다. 20년 넘는 기간 동안
    자동차, 전기차, 항공우주, 의료 및 산업 분야 고객이 까다로운 형상을 반복 가능하고 고신뢰성의
    양산 부품으로 전환하도록 지원해 왔습니다.

    당사는 무역 회사가 아닙니다. 모든 주조는 당사의 동관 시설 내에서 생산되며, 현대식 콜드 챔버
    다이캐스팅 셀은 완전 자동화된 로봇 취출, 실시간 X선 기공 검출, 고정밀 CNC 가공 센터와 통합되어
    있습니다. 이러한 수직 계열화를 통해 설계, 시뮬레이션, 주조, 가공, 마감, 검사에 이르는 전체
    공정에서 치수 정밀도, 표면 품질, 납기를 단일 품질 경영 시스템(ISO 9001 및 IATF 16949 인증) 아래
    통제할 수 있습니다.

    당사의 엔지니어링 팀은 최초의 DFM 검토부터 고객과 협력하며, Magma 및 Moldflow 시뮬레이션을
    활용해 첫 금형 가공 전에 콜드 셧, 가스 포집, 수축 기공을 제거합니다. 그 결과 개발 주기가 단축되고,
    부품당 비용이 낮아지며, 구조 부품이 첫 시도에서 자격을 통과합니다. 경량 마그네슘 브래킷, 열처리
    가능한 반용융 레오캐스트 부품, 또는 EV 배터리 플랫폼용 5000T 대형 구조물이 필요하든, KingShip은
    귀사의 장기 제조 파트너가 되도록 만들어졌습니다.

