intro:
  heading: "Qui nous sommes"
  lead: "Un fabricant B2B de moulage sous pression verticalement intégré, avec une planification de production et de contrôle propre à chaque projet."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. est un fournisseur B2B spécialisé dans le moulage
    sous pression haute pression d'alliages d'aluminium et de magnésium, l'usinage CNC interne, le
    l'évaluation des procédés de fonderie et l'ingénierie d'outillage. L'entreprise accompagne les programmes automobiles,
    de véhicules électriques, industriels et d'autres applications de fabrication par une ingénierie et une
    planification de production propres au projet.

    Nous ne sommes pas un courtier. Les pièces moulées sont fabriquées dans notre usine de Dongguan.
    Le moulage en chambre froide, l'usinage CNC et la métrologie soutiennent la planification de production
    propre au projet. Les méthodes de contrôle, l'échantillonnage et la documentation sont convenus selon
    le plan et les exigences du client.

    Notre équipe d'ingénierie collabore avec les clients dès le premier examen DFM et utilise des simulations
    de remplissage et de solidification lorsque cela correspond au périmètre du projet. Avant le lancement,
    la gamme de fabrication et le périmètre de contrôle sont confirmés selon le plan, le volume et les
    exigences qualité.

