quality:
  heading: "Qualitätskontrolle & Zertifizierung"
  lead: "Qualitätsplanung anhand vereinbarter Zeichnungsanforderungen, Prüfumfänge und dokumentierter Abnahmekriterien."
  body: |
    Kingship (Dongguan) Precision Manufacturing Co., Ltd. verfügt über das IATF-16949:2016-Zertifikat
    T207408 / 0613009 für die Herstellung von Druckguss- und Bearbeitungsteilen; Produktdesign nach
    Abschnitt 8.3 ist ausgeschlossen. Das ISO-9001:2015-Zertifikat DZ/CN/2411010Q umfasst
    Präzisionsmechanikteile und Druckgussformen.

    Verfügbare Prüfmethoden umfassen Röntgen, CMM sowie Leck- und Druckprüfung für Projektanforderungen.
    Prüfmerkmale, Prüfhäufigkeit, Abnahmekriterien und Berichtsformat werden vor der Produktionsfreigabe
    vereinbart.

    Prüf- und Dokumentationsumfang werden anhand der Zeichnung, der Kundenanforderungen und der
    tatsächlichen Anlagenfähigkeit bestätigt.
