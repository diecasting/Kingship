faq:
  heading: "자주 묻는 질문"
  items:
    - question: "어떤 알루미늄 및 마그네슘 합금을 주조하나요?"
      answer: "알루미늄 및 마그네슘 주조 합금은 도면, 용도 및 현재 자재 가용성에 따라 검토합니다. 최종 합금과 상태는 각 RFQ에서 확인합니다."
    - question: "최대 다이캐스팅 머신 토네이지는 얼마인가요?"
      answer: "장비 선택은 부품 크기, 금형 설계, 합금 및 필요한 샷 중량에 따라 확인합니다. 양산 시작 전 프로젝트별 타당성 검토를 수행합니다."
    - question: "사내 CNC 가공 및 검사를 제공하나요?"
      answer: "CNC 후가공은 사내에서 제공합니다. 장비 사양, 검사 방법 및 각 공차의 실현 가능성은 프로젝트별로 확인합니다."
    - question: "자동차 품질 표준 인증을 받았나요?"
      answer: "Kingship (Dongguan) Precision Manufacturing Co., Ltd.는 다이캐스트·가공 부품 제조에 대해 IATF 16949:2016 인증 T207408 / 0613009(8.3조 제외)를, 정밀 기계 부품·다이캐스팅 금형에 대해 ISO 9001:2015 인증 DZ/CN/2411010Q를 보유합니다."
    - question: "제조 가능성 설계(DFM)를 지원하나요?"
      answer: "DFM에는 프로젝트 범위에 적합한 경우 충전, 응고 및 냉각 시뮬레이션을 포함할 수 있습니다. 금형 및 공정 결정은 부품별 검증을 전제로 합니다."
    - question: "일반적인 견적 소요 시간은 얼마인가요?"
      answer: "요구사항이 명확한 RFQ는 도면, 제조 범위, 검사 요구사항 및 프로젝트 위험을 검토한 후 견적 일정을 안내합니다."
    - question: "저량 브리지 금형을 지원하나요?"
      answer: "예. 당사는 전체 생산 금형에 투자하기 전에 효율적인 소량 프로토타입 및 검증을 위한 브리지 금형을 제공합니다."

rfq:
  heading: "견적 요청"
  lead: "도면과 요구사항을 보내주시면 기술 검토와 RFQ 준비를 진행합니다."
  body: |
    재료, 벽두께, 공차, 표면 처리, 연간 예상 물량을 알려주세요. 당사 엔지니어링 팀이 프로젝트를
    검토하고 실용적이고 비용 최적화된 제조 계획으로 회신합니다.
