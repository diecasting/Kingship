intro:
  heading: "Wer wir sind"
  lead: "Ein vertikal integrierter B2B-Druckgusshersteller – vom flüssigen Metall bis zum fertigen Bauteil."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. ist ein spezialisierter B2B-Lieferant für
    Hochdruck-Druckguss aus Aluminium- und Magnesiumlegierungen, interne CNC-Nachbearbeitung,
    Semi-Solid-Rheocasting und professionellen Werkzeugbau. Seit mehr als zwei Jahrzehnten helfen wir
    Kunden aus Automobilbau, Elektrofahrzeugen, Luftfahrt, Medizintechnik und Industrie, anspruchsvolle
    Geometrien in wiederholbare, hochintegritäre Serienteile zu verwandeln.

    Wir sind kein Handelsunternehmen. Jedes Bauteil wird in unserer eigenen Anlage in Dongguan gefertigt,
    wo moderne Kaltkammer-Druckgusszellen mit vollautomatisierter Roboterentnahme, Echtzeit-Röntgen-
    Porositätsprüfung und einem präzisen CNC-Bearbeitungszentrum integriert sind. Diese vertikale
    Integration gibt uns Kontrolle über Maßhaltigkeit, Oberflächenqualität und Lieferzeit über den
    gesamten Prozess – von Design, Simulation, Guss, Bearbeitung, Veredelung bis Prüfung – unter einem
    einzigen, nach ISO 9001 und IATF 16949 zertifizierten Qualitätsmanagementsystem.

    Unser Engineering-Team arbeitet ab der ersten DFM-Besprechung mit den Kunden, nutzt Magma- und
    Moldflow-Simulation, um kalte Läufe, Lufteinschlüsse und Schrumpfporosität zu eliminieren, bevor
    das erste Werkzeug gefertigt wird. Das Ergebnis ist ein kürzerer Entwicklungszyklus, niedrigere
    Stückkosten und Strukturbauteile, die beim ersten Mal qualifiziert werden.

