      - "Großwerkzeug-Wärmemanagement"
      - "Projektbezogene CNC-Nachbearbeitung"
    equipment:
      - "Maschinen- und Formengröße im RFQ bestätigt"
      - "Prüfmethode je Projekt"
    applications:
