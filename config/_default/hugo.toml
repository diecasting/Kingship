theme = "blowfish"
baseURL = "https://kingship.alumcasting.com/"

# 禁用空的分类法页面（tags/authors/series/categories 均无内容引用），消除 GSC Soft 404
disableKinds = ["taxonomy", "term"]

# 核心修正：移除 contentDir 的硬编码，改用标准 Hugo 路径模式
defaultContentLanguage = "en"
title = "KingShip Precision"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 30
hasCJKLanguage = true
buildDrafts = false
buildFuture = false
enableEmoji = true

# ==========================================================================
# 🌍 修正后的多语言配置 (使用标准 Hugo 路径结构)
# ==========================================================================
[languages]
  [languages.en]
    label = "English"
    title = "KingShip Precision"
    weight = 1
    locale = "en-us"

  [languages.de]
    label = "Deutsch"
    title = "KingShip Präzisionsdruckguss"
    weight = 2
    locale = "de-de"

  [languages.es]
    label = "Español"
    title = "KingShip Fundicion a Presion"
    weight = 3
    locale = "es-es"

  [languages.fr]
    label = "Français"
    title = "KingShip Fonderie Sous Pression"
    weight = 4
    locale = "fr-fr"

  [languages.ja]
    label = "日本語"
    title = "KingShip 精密ダイカスト"
    weight = 5
    locale = "ja-jp"

  [languages.it]
    label = "Italiano"
    title = "KingShip Precision"
    weight = 6
    locale = "it-it"

  [languages.ko]
    label = "한국어"
    title = "KingShip Precision"
    weight = 7
    locale = "ko-kr"

# Additional languages can be added by registering a [languages.<code>] block here,
# creating config/_default/languages.<code>.toml + menus.<code>.toml, and translating content.

# ==========================================================================
# 🎯 主题核心全局参数
# ==========================================================================
[params]
  customCSS = ["css/custom.css"]
  maxContentWidth = "max-w-screen-xl" 
  headerWidth = "max-w-screen-xl"
  
  # 全局关闭博客特有的社交/作者信息
  showSharing = false
  showRelated = false
  showAuthor = true
  showAuthorBottom = true
  sharing = false

# ==========================================================================
# 🛠️ Markup 设置 (确保 RFQ 表单 HTML 可渲染)
# ==========================================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5
  