capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "アルミニウムダイカスト"
    heading: "アルミニウムダイカスト"
    body: |
      アルミニウム高圧ダイカストは当社生産の柱です。ADC12・A380・A356・A360合金で幅広い構造・機能部品を
      鋳造し、熱伝導性、耐食性、寸法安定性のバランスをとります。設備選定は、部品サイズ、金型設計、
      合金、必要なショット重量に基づいて検討します。

      DFMでは、案件範囲に適する場合に充填・凝固・冷却シミュレーションを含められます。CNC後加工は機能面、
      穴、シール面に対応し、各公差の実現性は特性ごとに確認します。二次工程の可否はRFQで確認します。

      代表的な用途は、パワートレイン筐体、EVバッテリートレイ・ブラケット、ヒートシンク、照明筐体、
      電子機器筐体です。最終的な合金と状態は、図面、案件要件、現在の材料供給状況に基づいて確認します。
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "高圧ダイカスト"
      - "CNC加工"
      - "陽極酸化・粉体塗装"
      - "含浸処理"
    equipment:
      - "コールドチャンバーHPDC工程の選定"
      - "案件別CNC後加工範囲"
    applications:
      - "パワートレイン"
      - "EVバッテリー筐体"
      - "ヒートシンク・筐体"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "気孔管理下のA356アルミニウムダイカスト部品"
      title: "A356アルミニウムダイカスト"
    learn_more: "/ja/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "マグネシウムダイカスト"
    heading: "マグネシウムダイカスト"
    body: |
      マグネシウムダイカストは最大の軽量化を実現します。アルミニウムより約3分の1軽く、同等の剛性を持つため、
      重量に敏感な自動車・航空宇宙・プレミアム電子部品の材料として選ばれます。マグネシウム案件は、
      生産範囲を確定する前に、合金、設備構成、薄肉形状の実現性、腐食対策を確認します。

      マグネシウムの高比強度と優れたEMI/RFIシールド性は、EVブラケット、センサー筐体、ドローンフレーム、
      ハンディ機器に最適です。表面処理と検査方法は、合金、用途、図面要件に応じて選定します。

      マグネシウム鋳造には厳格な工程管理が必要なため、当社エンジニアが溶解保護・注入速度・金型温度を
      密に管理し、酸化やホットクラックを防ぎます。
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "高圧マグネシウムダイカスト"
      - "パッシベーション"
      - "電気めっき"
    equipment:
      - "マグネシウムHPDC工程の確認"
      - "案件別X線検査計画"
    applications:
      - "自動車ブラケット"
      - "航空宇宙部品"
      - "プレミアムハンディ機器"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "航空宇宙および3C電子用軽量マグネシウムダイカスト部品"
      title: "マグネシウムダイカスト部品"
    learn_more: "/ja/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "半凝固レオキャスト"
    heading: "半凝固レオキャスト"
    body: |
      半凝固レオキャストは、スラリー生成の管理、熱処理性、明確な気孔対策を必要とする案件向けの
      エンジニアリング手法です。工程計画は、合金、形状、金型設計、受入基準によって異なります。

      熱処理、溶接、機械加工、検査の要件は用途ごとに確認します。レオキャスト案件の受注前に、
      現在の生産能力、設備、合金の適格性を確認します。

      レオキャストは、工程メカニズム、材料挙動、検査計画を一体で検討する必要があるEV・航空宇宙の
      構造案件で評価します。
    materials:
      - "RFQで確認するアルミ半凝固材"
      - "案件別工程レビュー"
    processes:
      - "半凝固レオキャスト"
      - "T5 / T6熱処理"
      - "金属組織検証"
    equipment:
      - "RFQで確認する半凝固工程"
      - "案件別X線計画"
    applications:
      - "EV構造ノード"
      - "航空宇宙ブラケット"
      - "疲労-critical部品"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "アルミニウム構造ダイカスト部品"
      title: "アルミニウム構造鋳造"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "大型構造部品の検討"
    heading: "大型構造部品の検討"
    body: |
      大型構造鋳造では、複数のプレス部品や溶接部品を一つの軽量部品に統合できる場合があります。例として、
      バッテリートレイ側レール、ショックタワー、トンネルハウジング、クロスメンバーがあります。

      このような部品には、精密な射出制御、大型金型の熱管理、ひずみと気孔を抑える管理された工程窓が
      必要です。フィージビリティ確定前に、設備・金型寸法、ショット重量、合金、検査計画を確認します。

      工程計画にはCNC後加工や仕上げを含められます。加工ルートと検査範囲は完成品図面に基づいて合意します。
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "大型構造HPDC案件の検討"
      - "大型金型熱管理"
      - "案件別CNC後加工"
    equipment:
      - "RFQで確認する設備・金型寸法"
      - "案件別検査方法"
    applications:
      - "EVバッテリー構造"
      - "ショックタワー・クロスメンバー"
      - "構造ノード"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "生産現場にある大型高圧ダイカストマシン"
      title: "大型構造部品の検討"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "高精度CNC加工"
    heading: "高精度CNC加工"
    body: |
      鋳造は物語の半分にすぎません。KingShip の社内高精度CNC加工センターが部品を完成させます。ダイカスト
      工程では届かない重要接合面の穴あけ、タップ、フライス、リーミングを行います。設備仕様、段取り、
      各公差の実現性は案件ごとに確認します。

      加工が鋳造の隣にあるため、外注による遅延や品質上の言い争いがなくなります。鋳造から切削まで基準が
      一貫し、初物レポートは同じフロアで生成され、設計変更は即座にセルへ反映されます。

      耐圧シール部品では、漏れ試験の方法、範囲、サンプリングを案件の検査計画の一部として合意します。
    materials:
      - "アルミ合金"
      - "マグネシウム合金"
    processes:
      - "CNCフライス・穴あけ・旋削"
      - "高精度穴あけ・タップ"
      - "案件別漏れ試験計画"
    equipment:
      - "CNC後加工設備"
      - "漏れ試験設備"
    applications:
      - "シール面"
      - "重要接合特徴"
      - "完成部品"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "高精度多軸CNC加工による高精度ダイカスト部品"
      title: "高精度CNC加工"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "ダイカスト金型"
    heading: "ダイカスト金型"
    body: |
      金型品質は後工程全体に影響します。金型設計、ゲート、冷却、保守計画は、完成品図面と生産要件に
      基づいて策定します。

      金型製作と保守の範囲は案件ごとに確認します。量産金型の前に検証が必要なプログラムでは、
      ブリッジ金型または試作金型を評価できます。

      金型寿命は案件依存であり、金型設計、合金、工程、保守、受入基準に基づいて確認します。
    materials:
      - "H13金型鋼"
      - "カスタム金型材"
    processes:
      - "金型設計・シミュレーション"
      - "RFQで確認する金型製作範囲"
      - "保守・改修"
    equipment:
      - "CAD/CAM・DFMレビュー"
      - "案件別金型製作範囲"
    applications:
      - "量産金型"
      - "ブリッジ金型"
      - "ファミリー金型"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "鋳造から仕上げまでの垂直統合製造プロセス"
      title: "統合金型・プロセス"

