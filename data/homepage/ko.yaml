capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "알루미늄 다이캐스팅"
    heading: "알루미늄 다이캐스팅"
    body: |
      알루미늄 합금 고압 다이캐스팅은 당사 생산의 중추입니다. 당사는 ADC12, A380, A356, A360 합금으로
      구조 및 기능 부품을 폭넓게 주조하며, 까다로운 서비스 환경을 위해 열전도율, 내식성, 치수 안정성을
      균형 있게 맞춥니다. 콜드 챔버 머신은 400T에서 5000T까지 확장되어, 복잡한 박벽 인클로저부터 단일
      샷으로 생산하는 대형 자동차 구조 부품까지 모두 소화합니다.

      모든 알루미늄 다이캐스팅 프로그램은 금형 충전 시뮬레이션으로 시작됩니다. 금형 제작 전에 충전, 응고,
      냉각을 모델링함으로써 콜드 셧, 미충전, 수축 기공을 설계 단계에서 제거하여 생산 라인이 아닌 곳에서
      해결합니다. 주조 후 사내 CNC 가공 센터는 임계 결합 면을 ±0.01 mm로 유지하며, 아노다이징, 분체
      도장, 숏 블라스팅, 함침 등의 후공정은 동일 시설 내에서 조율됩니다.

      전형적인 용도로는 자동차 파워트레인 하우징, EV 배터리 트레이 및 브래킷, 히트 싱크, 조명 하우징,
      전자 인클로저가 있습니다. 검증된 재료 거동이 필요한 고객을 위해 당사는 ADC12 특성 및 A356 구조
      무결성에 대한 엔지니어링 레퍼런스를 게시하여 설계 팀이 자신 있게 사양을 지정할 수 있도록 합니다.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "고압 다이캐스팅"
      - "CNC 가공"
      - "아노다이징 및 분체 도장"
      - "함침"
    equipment:
      - "400T–5000T 콜드 챔버 머신"
      - "5축 CNC 가공 센터"
    applications:
      - "자동차 파워트레인"
      - "EV 배터리 하우징"
      - "히트 싱크 및 인클로저"
    image:
      url: "https://alumcasting.com/images/A356-aluminum-die-casting-porosity-control.webp"
      alt: "기공 제어 검사를 받는 A356 알루미늄 다이캐스트 부품"
      title: "A356 알루미늄 다이캐스팅"
    learn_more: "/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "마그네슘 다이캐스팅"
    heading: "마그네슘 다이캐스팅"
    body: |
      마그네슘 다이캐스팅은 최대의 중량 절감을 제공합니다 — 동등한 강성 대비 알루미늄보다 약 3분의 1
      가볍기 때문에 중량에 민감한 자동차, 항공우주, 프리미엄 전자 부품의 선호 소재입니다. KingShip은
      전용 핫/콜드 챔버 머신에서 AZ91D 및 AM60B 마그네슘 합금을 주조하며, 복잡한 박벽 형상에 대해 최소
      벽두께 1.0 mm까지 구현합니다.

      마그네슘의 우수한 비강도와 EMI/RFI 차폐 성능은 전기차 브래킷, 센서 하우징, 드론 프레임, 휴대용
      기기에 가치가 있습니다. 당사는 마그네슘 내식성을 위해 최적화된 피막 처리 및 전기 도금 공정으로
      표면 무결성을 보호하고, 선적 전 실시간 X선 검사로 벽두께와 내부 품질을 확인합니다.

      마그네슘 주조는 엄격한 공정 제어를 요구하므로, 당사 엔지니어는 산화와 핫 크랙을 방지하기 위해
      용탕 보호, 사출 속도, 금형 온도를 면밀히 관리합니다. 그 결과 경량이고 치수 안정적인 부품이 되어
      OEM이 구조 성능을 희생하지 않고도 공격적인 차량 중량 및 주행 거리 목표를 달성하도록 돕습니다.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "마그네슘 고압 다이캐스팅"
      - "피막 처리"
      - "전기 도금"
    equipment:
      - "160T–2250T 마그네슘 다이캐스팅 머신"
      - "실시간 X선 검사"
    applications:
      - "자동차 브래킷"
      - "항공우주 부품"
      - "프리미엄 휴대용 기기"
    image:
      url: "https://alumcasting.com/images/lightweight-magnesium-die-casting-3c-aerospace-parts.webp"
      alt: "경량 마그네슘 다이캐스트 항공우주 및 3C 전자 부품"
      title: "마그네슘 다이캐스트 부품"
    learn_more: "/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "반용융 레오캐스팅"
    heading: "반용융 레오캐스팅"
    body: |
      반용융 레오캐스팅은 저기공성, 고연성, 열처리 가능성을 결합해야 하는 부품을 위한 당사의 솔루션입니다.
      합금을 반용융 상태 — 액체에 부유하는 고체 구형립 슬러리 — 로 성형함으로써, 기존 고압 다이캐스팅이
      완전히 피할 수 없는 가스 포집과 수축 기공을 거의 제거합니다.

      그 결과 T5 또는 T6 열처리, 용접, 기계 가공이 가능한 주조물이 되어, 완벽한 무결성이 타협할 수 없는
      구조용 안전 부품의 문을 엽니다. KingShip은 Yizumi 반용융 레오캐스팅 시스템을 운영하고, 금속 조직
      검사와 실시간 X선 비교로 미세 조직의 균일성을 검증하여 고객이 충돌 관련 및 하중 지지 애플리케이션을
      위해 레오캐스트 부품을 자격화할 수 있도록 합니다.

      레오캐스팅은 EV 및 항공우주 구조 노드, 서스펜션 브래킷, 붐 등 피로 수명이 중요한 분야에 특히
      매력적입니다. 기공을 소스에서 줄임으로써 다운스트림 검사 부담을 줄이고 선적되는 모든 로트의
      예측 가능성을 향상시킵니다.
    materials:
      - "A356 Rheocast"
      - "맞춤형 알루미늄 슬러리"
    processes:
      - "반용융 레오캐스팅"
