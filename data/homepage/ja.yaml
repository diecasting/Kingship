  lead: "合意した図面要求、検査範囲、文書化された受入基準に基づく品質計画。"
  body: |
    Kingship (Dongguan) Precision Manufacturing Co., Ltd.は、ダイカスト品および機械加工品の製造について
    IATF 16949:2016認証 T207408 / 0613009を保有しています。箇条8.3の製品設計は除外されています。
    ISO 9001:2015認証 DZ/CN/2411010Qは、精密機械部品およびダイカスト金型を対象としています。

    利用可能な検査方法には、案件要件に応じたX線、CMM、漏れ・圧力試験があります。検査特性、サンプリング
    頻度、受入基準、報告書形式は生産承認前に合意します。

    検査および文書化の範囲は、図面、顧客品質要求、実際の設備能力に基づいて確認します。
