capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Aluminum Die Casting"
    heading: "Aluminum Die Casting"
    body: |
      Aluminum high-pressure die casting is the backbone of our production. We cast a wide range
      of structural and functional components in ADC12, A380, A356 and A360 alloys, balancing
      thermal conductivity, corrosion resistance and dimensional stability for demanding service
      environments. Machine selection is reviewed against part size, die design, alloy and
      required shot weight rather than presented as one universal equipment range.

      DFM can include fill, solidification and cooling simulation where it fits the project
      scope. Post-casting CNC post-machining supports functional faces, holes and sealing
      surfaces; tolerance feasibility is defined per feature. Secondary-process availability
      is confirmed at RFQ.

      Typical applications include automotive powertrain housings, EV battery trays and brackets,
      heat sinks, lighting housings and electronic enclosures. Final alloy and condition are
      confirmed against the drawing, project requirements and current material availability.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "High-Pressure Die Casting"
      - "CNC Machining"
      - "Anodizing & Powder Coating"
      - "Impregnation"
    equipment:
      - "Cold-chamber HPDC process selection"
      - "CNC post-machining scope defined per project"
    applications:
      - "Automotive powertrain"
      - "EV battery housings"
      - "Heat sinks & enclosures"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "A356 aluminum die casting component under porosity control inspection"
      title: "A356 Aluminum Die Casting"
    learn_more: "/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Magnesium Die Casting"
    heading: "Magnesium Die Casting"
    body: |
      Magnesium die casting delivers the ultimate weight reduction — roughly one-third lighter
      than aluminum at comparable stiffness — making it the material of choice for weight-critical
      automotive, aerospace and premium electronics components. Magnesium projects are reviewed
      for alloy, machine configuration, thin-wall feasibility and corrosion strategy before
      production scope is confirmed.

      Magnesium's high strength-to-weight ratio and excellent EMI/RFI shielding are valuable for
      electric-vehicle brackets, sensor housings, drone frames and handheld devices. Surface
      treatment and inspection methods are selected for the specific alloy, application and
      drawing requirements.

      Because magnesium casting demands strict process control, our engineers manage melt
      protection, injection velocity and die temperature closely to avoid oxidation and hot
      cracking. The outcome is a lightweight, dimensionally stable component that helps OEMs hit
      aggressive vehicle-mass and range targets without sacrificing structural performance.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "High-Pressure Magnesium Die Casting"
      - "Passivation"
      - "Electroplating"
    equipment:
      - "Magnesium HPDC process review"
      - "Project-specific X-ray inspection planning"
    applications:
      - "Automotive brackets"
      - "Aerospace components"
      - "Premium handheld devices"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "Lightweight magnesium die cast aerospace and 3C electronic parts"
      title: "Magnesium Die Casting Parts"
    learn_more: "/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Semi-Solid Rheocasting"
    heading: "Semi-Solid Rheocasting"
    body: |
      Semi-solid rheocasting is an engineering route for projects that need controlled slurry
      formation, heat-treatability and a defined porosity strategy. The process plan depends on
      alloy, component geometry, die design and acceptance requirements.

      Heat treatment, welding, machining and inspection requirements are reviewed for each
      application. Current production capability, equipment and alloy qualification are confirmed
      before a rheocasting project is accepted.

      Rheocasting is evaluated for EV and aerospace structural projects where process mechanism,
      material behaviour and inspection planning need to be considered together.
    materials:
      - "Aluminum semisolid grade confirmed at RFQ"
      - "Project-specific process review"
    processes:
      - "Semi-Solid Rheocasting"
      - "T5 / T6 Heat Treatment"
      - "Metallographic Validation"
    equipment:
      - "Semisolid process route confirmed at RFQ"
      - "Project-specific X-ray planning"
    applications:
      - "EV structural nodes"
      - "Aerospace brackets"
      - "Fatigue-critical components"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "Aluminium die-cast structural component"
      title: "Aluminium Structural Casting"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "Large Structural Casting"
    heading: "Large Structural Casting"
    body: |
      Large structural castings can consolidate multiple stamped or welded parts into a single
      lightweight component. Such castings — such
      as battery tray side rails, shock towers, tunnel housings and crossmembers — consolidate
      what used to be dozens of stamped and welded stampings into a single, stiff, lightweight
      aluminum part.

      Producing these parts demands more than tonnage. It requires precise shot control, thermal
      management of a large die, and disciplined process windows to control warpage and porosity.
      The engineering review considers the available machine envelope, die size, shot weight,
      alloy and inspection plan before feasibility is confirmed.

      The process plan can include CNC post-machining and finishing, with the machining route and
      inspection scope agreed against the finished-part drawing.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "Large-Structure HPDC Review"
      - "Large-Die Thermal Management"
      - "Project-Defined CNC Post-Machining"
    equipment:
      - "Machine and die envelope confirmed at RFQ"
      - "Inspection method selected per project"
    applications:
      - "EV battery structures"
      - "Shock towers & crossmembers"
      - "Structural nodes"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "Large high-pressure die-casting machine on a production floor"
      title: "Large Structural Casting"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Precision CNC Machining"
    heading: "Precision CNC Machining"
    body: |
      Casting is only half the story. KingShip's in-house high-precision CNC workshop completes the
      component — drilling, threading, milling and boring the critical mating surfaces that the
      die casting process cannot reach. Machine specifications, setup and tolerance feasibility
      are confirmed for each project.

      Because machining sits next to casting, we eliminate the hand-off delays and quality disputes
      that come with outsourcing. Datums are consistent from cast to cut, first-article reports are
      generated on the same floor, and last-minute design tweaks flow straight back to the cell.
      We also perform value-added operations such as helical threading, boss facing and tight-tolerance
      bores for sealing surfaces.

      For pressure-sealed components, leak-test method, range and sampling are agreed as part of
      the project inspection plan.
    materials:
      - "Aluminum Alloys"
      - "Magnesium Alloys"
    processes:
      - "CNC milling, drilling and turning"
      - "Precision Drilling & Threading"
      - "Project-specific leak-test planning"
    equipment:
      - "CNC post-machining equipment"
      - "Leak-testing equipment"
    applications:
      - "Sealing surfaces"
      - "Critical mating features"
      - "Finished components"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "Precision multi-axis CNC machining of tight-tolerance die cast parts"
      title: "Precision CNC Machining"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Die Casting Tooling"
    heading: "Die Casting Tooling"
    body: |
      Tooling quality defines everything that follows. Die design, gating, cooling and
      maintenance planning are developed against the finished-part drawing and production
      requirements.

      Tool-making and maintenance scope is confirmed for each project. Bridge or prototype
      tooling can be evaluated when a program needs validation before a production die.

      Tool life is project-dependent and is reviewed against die design, alloy, process,
      maintenance and acceptance criteria.
    materials:
      - "H13 Tool Steel"
      - "Custom Die Materials"
    processes:
      - "Die Design & Simulation"
      - "Tool-Manufacturing Scope Confirmed at RFQ"
      - "Maintenance & Refurbishment"
    equipment:
      - "CAD/CAM and DFM review"
      - "Project-defined tool-making scope"
    applications:
      - "Production dies"
      - "Bridge tooling"
      - "Family tooling"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "Vertically integrated manufacturing process from casting to finishing"
      title: "Integrated Tooling & Process"

