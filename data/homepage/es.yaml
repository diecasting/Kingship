capabilities:
  - id: "aluminum-die-casting"
    anchor: "capability-aluminum"
    name: "Moldeo por inyección de aluminio"
    heading: "Moldeo por inyección de aluminio"
    body: |
      El moldeo por inyección de aluminio a alta presión es la base de nuestra producción. Fundimos una
      amplia gama de componentes estructurales y funcionales en las aleaciones ADC12, A380, A356 y A360,
      equilibrando conductividad térmica, resistencia a la corrosión y estabilidad dimensional. La selección
      de máquina se revisa según el tamaño de la pieza, el diseño del molde, la aleación y el peso de disparo
      requerido.

      El DFM puede incluir simulaciones de llenado, solidificación y refrigeración cuando encajan en el
      alcance. El mecanizado CNC posterior permite trabajar superficies funcionales, agujeros y superficies
      de sellado; la viabilidad de cada tolerancia se define por característica. La disponibilidad de procesos
      secundarios se confirma durante el RFQ.

      Las aplicaciones típicas incluyen carcasas de tren motriz, bandejas y soportes de baterías EV,
      disipadores de calor y carcasas electrónicas. La aleación y el estado final se confirman con el plano,
      los requisitos del proyecto y la disponibilidad actual de material.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
      - "A360"
    processes:
      - "Moldeo por inyección a alta presión"
      - "Mecanizado CNC"
      - "Anodizado y recubrimiento en polvo"
      - "Impregnación"
    equipment:
      - "Selección del proceso HPDC en cámara fría"
      - "Alcance de mecanizado CNC por proyecto"
    applications:
      - "Tren motriz de automoción"
      - "Carcasas de baterías EV"
      - "Disipadores y carcasas"
    image:
      url: "/img/aluminium-cast-structural-component.webp"
      alt: "Componente de moldeo por inyección de aluminio A356 bajo control de porosidad"
      title: "Moldeo por inyección de aluminio A356"
    learn_more: "/es/aluminum-die-casting/"

  - id: "magnesium-die-casting"
    anchor: "capability-magnesium"
    name: "Moldeo por inyección de magnesio"
    heading: "Moldeo por inyección de magnesio"
    body: |
      El moldeo por inyección de magnesio ofrece la máxima reducción de peso — aproximadamente un tercio
      más ligero que el aluminio con rigidez comparable — y es el material preferido para componentes de
      automoción, aeronáutica y electrónica premium que son críticos de peso. Los proyectos de magnesio se
      revisan en cuanto a aleación, configuración de máquina, viabilidad de pared delgada y estrategia de
      corrosión antes de confirmar el alcance de producción.

      La alta resistencia con bajo peso y el excelente blindaje EMI/RFI del magnesio son valiosos para
      soportes de EV, carcasas de sensores y dispositivos portátiles. El tratamiento superficial y los métodos
      de inspección se seleccionan según la aleación, la aplicación y los requisitos del plano.

      Como el moldeo de magnesio exige un control estricto, nuestros ingenieros gestionan la protección del
      baño, la velocidad de inyección y la temperatura del molde para evitar oxidación y grietas en caliente.
    materials:
      - "AZ91D"
      - "AM60B"
    processes:
      - "Moldeo por inyección de magnesio a alta presión"
      - "Pasivación"
      - "Galvanizado"
    equipment:
      - "Revisión de la ruta HPDC de magnesio"
      - "Planificación de rayos X por proyecto"
    applications:
      - "Soportes de automoción"
      - "Componentes aeronáuticos"
      - "Dispositivos portátiles premium"
    image:
      url: "/img/magnesium-die-casting-banner.webp"
      alt: "Piezas de magnesio ligeras para aeronáutica y electrónica 3C"
      title: "Moldeo por inyección de magnesio"
    learn_more: "/es/magnesium-die-casting/"

  - id: "semi-solid-rheocasting"
    anchor: "capability-rheocasting"
    name: "Colada semi-sólida (Rheocasting)"
    heading: "Colada semi-sólida (Rheocasting)"
    body: |
      El rheocasting semi-sólido es una ruta de ingeniería para proyectos que necesitan una formación
      controlada de la pasta, tratabilidad térmica y una estrategia de porosidad definida. El plan de proceso
      depende de la aleación, la geometría, el diseño del molde y los criterios de aceptación.

      Los requisitos de tratamiento térmico, soldadura, mecanizado e inspección se revisan para cada
      aplicación. La capacidad de producción, el equipo y la calificación de aleaciones se confirman antes de
      aceptar un proyecto de rheocasting.

      El rheocasting se evalúa para proyectos estructurales de EV y aeronáutica en los que deben considerarse
      conjuntamente el mecanismo del proceso, el comportamiento del material y la planificación de inspección.
    materials:
      - "Grado de aluminio semi-sólido confirmado en el RFQ"
      - "Revisión de proceso por proyecto"
    processes:
      - "Rheocasting semi-sólido"
      - "Tratamiento térmico T5 / T6"
      - "Validación metalográfica"
    equipment:
      - "Ruta de proceso semi-sólido confirmada en el RFQ"
      - "Planificación de rayos X por proyecto"
    applications:
      - "Nodos estructurales EV"
      - "Soportes aeronáuticos"
      - "Componentes críticos de fatiga"
    image:
      url: "/img/complex-aluminium-casting-with-ports.webp"
      alt: "Componente estructural de aluminio fundido"
      title: "Fundición estructural de aluminio"

  - id: "structural-casting"
    anchor: "capability-structural"
    name: "Piezas estructurales grandes"
    heading: "Piezas estructurales grandes"
    body: |
      Las piezas estructurales grandes pueden consolidar varios componentes estampados o soldados en una
      sola pieza ligera. Entre los ejemplos se incluyen rieles laterales de bandejas de baterías, torres de
      amortiguación, alojamientos de túnel y travesaños.

      Estas piezas exigen control preciso del disparo, gestión térmica de un molde grande y ventanas de
      proceso disciplinadas para controlar la deformación y la porosidad. La revisión de ingeniería considera
      el tamaño de máquina y molde, el peso de disparo, la aleación y el plan de inspección antes de confirmar
      la viabilidad.

      El plan de proceso puede incluir mecanizado CNC y acabado; la ruta de mecanizado y el alcance de
      inspección se acuerdan con el plano de la pieza terminada.
    materials:
      - "ADC12"
      - "A380"
      - "A356"
    processes:
      - "Revisión HPDC de grandes estructuras"
      - "Gestión térmica de utillaje grande"
      - "Mecanizado CNC definido por proyecto"
    equipment:
      - "Envolvente de máquina y molde confirmada en el RFQ"
      - "Método de inspección seleccionado por proyecto"
    applications:
      - "Estructuras de baterías EV"
      - "Torres de amortiguación y travesaños"
      - "Nodos estructurales"
    image:
      url: "/img/large-aluminium-structural-casting.webp"
      alt: "Máquina grande de moldeo por inyección a alta presión en una planta de producción"
      title: "Piezas estructurales grandes"

  - id: "precision-cnc-machining"
    anchor: "capability-cnc"
    name: "Mecanizado CNC de precisión"
    heading: "Mecanizado CNC de precisión"
    body: |
      El moldeo es solo la mitad de la historia. El centro CNC interno de KingShip completa el componente —
      taladrando, roscando, fresando y mandrinando superficies de acoplamiento críticas. Las especificaciones
      de máquina, la configuración y la viabilidad de cada tolerancia se confirman para cada proyecto.

      Al estar el mecanizado junto al moldeo, eliminamos retrasos y disputas de calidad del outsourcing.
      Las referencias son consistentes del molde al corte, y los cambios de diseño fluyen directamente a la
      célula. También realizamos operaciones de roscado helicoidal y mandrinado de altas tolerancias.

      Para componentes sellados por presión, el método, el rango y el muestreo de la prueba de fuga se
      acuerdan como parte del plan de inspección del proyecto.
    materials:
      - "Aleaciones de aluminio"
      - "Aleaciones de magnesio"
    processes:
      - "Fresado, taladrado y torneado CNC"
      - "Taladrado y roscado de precisión"
      - "Planificación de prueba de fuga por proyecto"
    equipment:
      - "Equipo de mecanizado CNC posterior"
      - "Equipo de prueba de fuga"
    applications:
      - "Superficies de estanqueidad"
      - "Funciones de acoplamiento críticas"
      - "Componentes terminados"
    image:
      url: "/img/high-precision-cnc-workshop.webp"
      alt: "Mecanizado CNC multi-eje de precisión de piezas inyectadas de alta tolerancia"
      title: "Mecanizado CNC de precisión"

  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "Utillaje de moldeo por inyección"
    heading: "Utillaje de moldeo por inyección"
    body: |
      La calidad del molde condiciona todo el proceso. El diseño del molde, la alimentación, la refrigeración y
      la planificación del mantenimiento se desarrollan con el plano de la pieza terminada y los requisitos de
      producción.

      El alcance de fabricación y mantenimiento del utillaje se confirma para cada proyecto. Puede evaluarse
      utillaje puente o de prototipo cuando un programa necesita validación antes de un molde de producción.

      La vida útil del molde depende del proyecto y se revisa frente al diseño, la aleación, el proceso, el
      mantenimiento y los criterios de aceptación.
    materials:
      - "Acero para utillaje H13"
      - "Materiales de utillaje personalizados"
    processes:
      - "Diseño y simulación de utillajes"
      - "Alcance de fabricación confirmado en el RFQ"
      - "Mantenimiento y retoques"
    equipment:
      - "Revisión CAD/CAM y DFM"
      - "Alcance de utillaje definido por proyecto"
    applications:
      - "Utillajes de producción"
      - "Utillaje puente"
      - "Utillaje de familia"
    image:
      url: "/img/automated-die-casting-production-line.webp"
      alt: "Proceso de fabricación verticalmente integrado del moldeo al acabado"
      title: "Utillaje integrado"

