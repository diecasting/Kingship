intro:
  heading: "Quiénes somos"
  lead: "Un fabricante B2B de moldeo por inyección verticalmente integrado con planificación de fabricación e inspección específica para cada proyecto."
  body: |
    KingShip (Dongguan) Precision Manufacturing Co., Ltd. es un proveedor B2B especializado en moldeo
    por inyección a alta presión de aleaciones de aluminio y magnesio, mecanizado CNC interno,
    evaluación de procesos de fundición e ingeniería de utillaje. La empresa apoya programas de automoción,
    vehículos eléctricos, industria y otras aplicaciones de fabricación mediante ingeniería y planificación
    de producción específicas para cada proyecto.

    No somos una empresa comercial. Las piezas se fabrican en nuestra planta de Dongguan. El moldeo en
    cámara fría, el mecanizado CNC y el equipo de metrología apoyan la planificación de producción
    específica de cada proyecto. Los métodos de inspección, el muestreo y la documentación se acuerdan
    con el plano y los requisitos del cliente.

    Nuestro equipo de ingeniería colabora con los clientes desde la primera revisión DFM y utiliza
    simulaciones de llenado y solidificación cuando encajan en el alcance del proyecto. Antes de iniciar
    la producción se confirman la ruta de proceso y el alcance de inspección según el plano, el volumen y
    los requisitos de calidad.

