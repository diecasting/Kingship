  - id: "die-casting-tooling"
    anchor: "capability-tooling"
    name: "다이캐스팅 금형"
    heading: "다이캐스팅 금형"
    body: |
      금형 품질은 이후 모든 것을 결정합니다. KingShip은 고급 CAD/CAM, Pro/E, UG, Moldflow 시뮬레이션을
      활용하는 사내 금형 샵을 운영하여 더 오래 가고 더 깨끗한 부품을 생산하는 금형을 설계하고 제작합니다.
      최적화된 게이팅 및 냉각 시스템은 사이클 타임을 단축하고 기공을 최소화하며 금형 수명을 100,000 샷
      이상으로 연장합니다.

      금형을 자체 보유하면 반복이 빨라집니다 — 엔지니어링 변경, 유지보수, 리컨디셔닝이 제3자 납기 없이
      진행됩니다. 또한 독점적인 게이팅 노하우를 보호하고 제품군 전체에서 일관되게 유지할 수 있습니다.
      저량 브리지 프로그램을 위해서는 전체 생산 금형에 투자하기 전에 프로토타입을 빠르게 고객 손에 넣는
      브리지 금형을 제공합니다.

      잘 설계된 금형은 스크랩, 다운타임, 필드 고장에 대한 가장 저렴한 보험입니다. 그것이 KingShip이
      금형을 구매한 상품이 아니라 핵심 역량으로 다루는 이유입니다.
