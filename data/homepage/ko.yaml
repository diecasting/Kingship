intro:
  heading: "회사 소개"
  lead: "프로젝트별 생산 및 검사 계획으로 대응하는 수직 계열화 B2B 다이캐스팅 제조업체."
  body: |
    KingShip(동관) 정밀 제조 유한회사는 고압 알루미늄 및 마그네슘 합금 다이캐스팅, 사내 CNC 후가공,
    다이캐스팅 공정 검토, 금형 엔지니어링을 전문으로 하는 B2B 공급업체입니다. 자동차, 전기차, 산업 및
    기타 제조 프로그램에 프로젝트별 엔지니어링과 생산 계획으로 대응합니다.

    KingShip은 둥관 제조 거점을 중심으로 다이캐스팅, CNC 후가공 및 계측을 조정합니다.
    적용 생산 공정과 외부 공정 범위는 프로젝트별로 확인합니다. 검사 방법, 샘플링 및
    문서화 범위는 도면과 고객 요구에 따라 합의합니다.

    당사 엔지니어링 팀은 최초 DFM 검토부터 고객과 협력하며 프로젝트 범위에 적합한 경우 충전 및 응고
    시뮬레이션을 활용합니다. 양산 시작 전 도면, 수량 및 품질 요구에 따라 공정 경로와 검사 범위를
    확정합니다.

